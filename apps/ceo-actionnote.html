    // --- Google Favicon & Domain Link Parser ---
    const parseDomainLinks = (urlsInput) => {
      if (!urlsInput) return [];
      const list = typeof urlsInput === 'string'
        ? urlsInput.split(',').map(u => u.trim()).filter(Boolean)
        : Array.isArray(urlsInput) ? urlsInput : [];

      return list.map((url, index) => {
        let domain = `Link ${index + 1}`;
        let cleanHost = 'google.com';
        try {
          const formattedUrl = url.startsWith('http://') || url.startsWith('https://') ? url : `https://${url}`;
          const parsed = new URL(formattedUrl);
          cleanHost = parsed.hostname.replace('www.', '');
          const parts = cleanHost.split('.');
          domain = parts.length >= 2 ? parts[0] : cleanHost;
        } catch (e) {
          domain = `Link ${index + 1}`;
          cleanHost = 'google.com';
        }
        const href = url.startsWith('http://') || url.startsWith('https://') ? url : `https://${url}`;
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${cleanHost}&sz=32`;
        return { domain, href, faviconUrl, original: url, cleanHost };
      });
    };

    // --- Domain Grouping for My Platforms (Groups platforms by base domain & deduplicates favicons) ---
    const groupPlatformsByDomain = (platformsList) => {
      if (!platformsList || !Array.isArray(platformsList)) return [];
      const domainGroupsMap = new Map();

      platformsList.forEach(platform => {
        const links = parseDomainLinks(platform.urls);
        if (!links || links.length === 0) {
          const fallbackHost = 'other';
          if (!domainGroupsMap.has(fallbackHost)) {
            domainGroupsMap.set(fallbackHost, {
              domainHost: 'other',
              faviconUrl: 'https://www.google.com/s2/favicons?domain=google.com&sz=32',
              items: []
            });
          }
          domainGroupsMap.get(fallbackHost).items.push({
            platformId: platform.id,
            title: platform.title || 'Untitled Platform',
            category: platform.category,
            href: '#',
            domainLabel: platform.title || 'Untitled'
          });
        } else {
          links.forEach(link => {
            const hostParts = (link.cleanHost || 'google.com').split('.');
            const baseDomain = hostParts.length >= 2 ? hostParts.slice(-2).join('.') : (link.cleanHost || 'google.com');
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${baseDomain}&sz=32`;

            if (!domainGroupsMap.has(baseDomain)) {
              domainGroupsMap.set(baseDomain, {
                domainHost: baseDomain,
                faviconUrl: faviconUrl,
                items: []
              });
            }

            const existingItems = domainGroupsMap.get(baseDomain).items;
            const isDuplicate = existingItems.some(
              it => it.platformId === platform.id && it.href === link.href
            );
            if (!isDuplicate) {
              existingItems.push({
                platformId: platform.id,
                title: platform.title || link.domain,
                category: platform.category,
                href: link.href,
                domainLabel: link.domain
              });
            }
          });
        }
      });

      return Array.from(domainGroupsMap.values());
    };

            projects: [setProjects, 'aiceo_v7_projects'],
            ideas: [setIdeas, 'aiceo_v7_ideas'],
            studies: [setStudies, 'aiceo_v7_studies'],
            mindsets: [setMindsets, 'aiceo_v7_mindsets'],
            platforms: [setPlatforms, 'aiceo_v7_platforms'],
          };

          if (updaters[type]) {
            const [setFn, key] = updaters[type];
            setFn(prev => {
              const next = prev.filter(i => i.id !== id);
              localStorage.setItem(key, JSON.stringify(next));
              return next;
            });
          }
        }
        setActiveModalItem(null);
      };

      // Bulk Delete Selected Handler
      const handleBulkDelete = async () => {
        if (selectedIds.size === 0) return;
        if (!confirm(`Are you sure you want to delete ${selectedIds.size} selected item(s)?`)) return;

        const allTypes = ['projects', 'ideas', 'studies', 'mindsets', 'platforms'];
        for (const id of selectedIds) {
          for (const type of allTypes) {
            await deleteItem(type, id);
          }
        }
        setSelectedIds(new Set());
      };

      // Save Platforms Bulk List
      const handleSavePlatforms = async (newList) => {
        setPlatforms(newList);
        localStorage.setItem('aiceo_v7_platforms', JSON.stringify(newList));

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const batch = db.batch();
          const userRef = db.collection('users').doc(user.uid);
          
          newList.forEach(p => {
            const docRef = userRef.collection('platforms').doc(p.id || `plat_${Date.now()}`);
            batch.set(docRef, p, { merge: true });
          });
          await batch.commit();
        }
        setIsPlatformModalOpen(false);
      };

      // Save Biz Communities Bulk List
      const handleSaveBizCommunities = async (newList) => {
        setBizCommunities(newList);
        localStorage.setItem('aiceo_v7_biz_communities', JSON.stringify(newList));

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const batch = db.batch();
          const userRef = db.collection('users').doc(user.uid);
          
          newList.forEach(c => {
            const docRef = userRef.collection('biz_communities').doc(c.id || `bizc_${Date.now()}`);
            batch.set(docRef, c, { merge: true });
          });
          await batch.commit();
        }
        setIsBizCommunityModalOpen(false);
      };

      // Category Updates
      const saveCategories = (type, list) => {
        if (type === 'Project') {
          setProjectCategories(list);
          localStorage.setItem('aiceo_v7_proj_cats', JSON.stringify(list));
        } else {
          setIdeaCategories(list);
          localStorage.setItem('aiceo_v7_idea_cats', JSON.stringify(list));
        }
        setIsCatModalOpen(false);
      };

      // Branding Updates
      const handleSaveBranding = (updated) => {
        setBranding(updated);
        localStorage.setItem('aiceo_v7_branding', JSON.stringify(updated));
        setIsBrandingModalOpen(false);
        setIsSloganModalOpen(false);
      };

      // Toggle Selection (Only toggles selection, does NOT open edit modal)
      const toggleSelect = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      // CEO Actions Save & Reset Handlers
      const handleSaveCeoActions = (newActions) => {
        setCeoActions(newActions);
        localStorage.setItem('aiceo_v7_ceo_actions', JSON.stringify(newActions));
        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          db.collection('users').doc(user.uid).collection('settings').doc('ceo_actions')
            .set({ actions: newActions })
            .catch(e => console.error('Error saving CEO actions to Firestore:', e));
        }
      };

      const handleResetCeoActions = () => {
        if (confirm('Reset CEO actions to default buttons?')) {
          setCeoActions(DEFAULT_CEO_ACTIONS);
          localStorage.removeItem('aiceo_v7_ceo_actions');
          setIsCeoActionManagerOpen(false);
        }
      };

      // 1. Dynamic CEO Action Execution Router (Gemini REST API & Local Actions)
      const handleExecuteAction = async (action) => {
        if (selectedIds.size === 0) return;

        if (action.type === 'export_md') {
          handleExportMarkdownModal();
          return;
        }
        if (action.type === 'bulk_status') {
          setIsBulkStatusModalOpen(true);
          return;
        }
        if (action.type === 'send_email') {
          handleSendEmail();
          return;
        }
        if (action.type === 'delete') {
          handleBulkDelete();
          return;
        }

        // AI Actions (Built-in or Custom AI Directives)
        const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = all.filter(item => selectedIds.has(item.id));

        const modeTitle = action.title || "AI Executive Analysis";
        const systemRole = action.directive || "You are an AI Executive Assistant providing high-level CEO strategic analysis.";

        let itemsFormatted = selectedList.map((item, idx) => {
          return `${idx + 1}. [${item.category || 'Exec'}] ${item.title || item.details}
- Company/Details: ${item.company || item.details || 'N/A'}
- Progress/Status: ${item.progress !== undefined ? item.progress + '%' : item.status || 'N/A'}
- Targets/Objectives: ${item.objective || 'N/A'}
- AI Context Vector: ${item.aiPrompt || 'N/A'}`;
        }).join('\n\n');

        const fullPrompt = `[ACTION DIRECTIVE]: ${systemRole}\n\n[USER DIRECTIVE / INSTRUCTION]:\n${instructionPrompt || 'Provide strategic guidance and key takeaways.'}\n\n[SELECTED MEMORY ITEMS (${selectedList.length})]:\n${itemsFormatted}`;

        setAiModalData({
          isOpen: true,
          loading: true,
          title: modeTitle,
          prompt: fullPrompt,
          result: ''
        });

        const apiKey = (typeof process !== 'undefined' && process.env && process.env.GEMINI_API_KEY) 
          || localStorage.getItem('aiceo_gemini_key') || '';

        if (apiKey) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: fullPrompt }] }]
              })
            });
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              setAiModalData(prev => ({ ...prev, loading: false, result: text }));
              return;
            }
          } catch (err) {
            console.error('Gemini REST API error:', err);
          }
        }

        // Fallback response generator if API key is not yet set
        setTimeout(() => {
          let fallbackResult = `## ${modeTitle}\n**Date**: ${new Date().toLocaleDateString()}\n**Selected Items Analyzed**: ${selectedList.length}\n\n`;
          if (systemRole) {
            fallbackResult += `### Action Directive:\n> "${systemRole}"\n\n`;
          }
          if (instructionPrompt) {
            fallbackResult += `### Executive Instruction:\n> "${instructionPrompt}"\n\n`;
          }
          fallbackResult += `### Executive Analysis Output:\n`;
          selectedList.forEach(item => {
            fallbackResult += `1. **${item.title || item.details}** (${item.category || 'HQ'})\n   - Progress: ${item.progress !== undefined ? item.progress + '%' : 'Active'}\n   - Alignment: Executing strategy per ${action.title} directive.\n`;
          });
          if (!apiKey) {
            fallbackResult += `\n\n---\n*💡 Tip: Enter your Gemini API Key in the box below to activate live real-time Gemini 2.0 Flash REST API calls.*`;
          }

          setAiModalData(prev => ({ ...prev, loading: false, result: fallbackResult }));
        }, 500);
      };

      // 2. Export Markdown Modal Handler
      const handleExportMarkdownModal = () => {
        if (selectedIds.size === 0) return;
        const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = all.filter(item => selectedIds.has(item.id));

        let md = `# ${branding.title} - Selected Executive Memory Export\n`;
        md += `*Export Date: ${new Date().toLocaleDateString()} | Total Selected Items: ${selectedList.length}*\n\n`;
        if (instructionPrompt.trim()) {
          md += `## Executive Directive / Instruction\n> ${instructionPrompt.trim()}\n\n---\n\n`;
        }
        md += `## Selected Items Specifications\n\n`;
        selectedList.forEach((item, idx) => {
          md += `### ${idx + 1}. [${item.category || 'Exec'}] ${item.title || item.details}\n`;
          if (item.company) md += `- **Company**: ${item.company}\n`;
          if (item.status) md += `- **Status**: ${item.status} (${item.progress}%)\n`;
          if (item.stars) md += `- **Rating**: ${item.stars} Star(s)\n`;
          if (item.objective) md += `- **Targets / Objectives**:\n${item.objective}\n`;
          if (item.aiPrompt) md += `- **AI Prompts for Actions**:\n${item.aiPrompt}\n`;
          if (item.details && item.title) md += `- **Details**: ${item.details}\n`;
          if (item.urls) md += `- **URLs**: ${item.urls}\n`;
          md += `\n`;
        });

        setMarkdownExportData({ isOpen: true, content: md });
      };

      // 3. Apply Bulk Progress (%) Update
      const handleApplyBulkStatus = async (newProgress) => {
        if (selectedIds.size === 0) return;

        setProjects(prev => {
          const next = prev.map(p => selectedIds.has(p.id) ? { ...p, progress: newProgress, updatedAt: new Date().toISOString().split('T')[0] } : p);
          localStorage.setItem('aiceo_v7_projects', JSON.stringify(next));
          return next;
        });

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const batch = db.batch();
          const userRef = db.collection('users').doc(user.uid);

          for (const id of selectedIds) {
            const proj = projects.find(p => p.id === id);
            if (proj) {
              const docRef = userRef.collection('projects').doc(id);
              batch.update(docRef, { progress: newProgress, updatedAt: new Date().toISOString().split('T')[0] });
            }
          }
          await batch.commit().catch(e => console.error('Bulk status update error:', e));
        }

        setIsBulkStatusModalOpen(false);
        alert(`Updated progress to ${newProgress}% for selected items.`);
      };

      // Send Email with Selected Items & Executive Instruction
      const handleSendEmail = () => {
        if (selectedIds.size === 0) return;
        const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = all.filter(item => selectedIds.has(item.id));

        let body = `Executive Briefing - ${branding.title}\nDate: ${new Date().toLocaleDateString()}\n\n`;
        if (instructionPrompt.trim()) {
          body += `[Executive Directives / Instruction]:\n${instructionPrompt.trim()}\n----------------------------------------\n\n`;
        }

        body += `Selected Memory Items (${selectedList.length}):\n\n`;
        selectedList.forEach((item, index) => {
          body += `${index + 1}. ${item.title || item.details}\n`;
          if (item.company) body += `   Company: ${item.company}\n`;
          if (item.category) body += `   Category: ${item.category}\n`;
          if (item.status) body += `   Status: ${item.status} (${item.progress}%)\n`;
          if (item.objective) body += `   Objectives:\n${item.objective}\n`;
          if (item.aiPrompt) body += `   AI Context:\n${item.aiPrompt}\n`;
          if (item.urls) body += `   URLs: ${item.urls}\n`;
          body += `\n`;
        });

        window.location.href = `mailto:?subject=${encodeURIComponent(`[${branding.title}] Selected Executive Directives & Briefing`)}&body=${encodeURIComponent(body)}`;
      };

      // Export CSV
      const handleExportCSV = () => {
        let csv = "Type,Title,Category,Company/Details,Status/Progress,Objectives,AI Prompt Vector,URLs,Date\n";

        projects.forEach(p => {
          csv += `"Project","${(p.title||'').replace(/"/g, '""')}","${p.category||''}","${p.company||''}","${p.status} (${p.progress}%)","${(p.objective||'').replace(/"/g, '""')}","${(p.aiPrompt||'').replace(/"/g, '""')}","${p.urls||''}","${p.updatedAt||''}"\n`;
        });
        ideas.forEach(i => {
          csv += `"Idea","${(i.title||'').replace(/"/g, '""')}","${i.category||''}","${(i.details||'').replace(/"/g, '""')}","Stars: ${i.stars||0}","N/A","N/A","${i.urls||''}","${i.createdAt||''}"\n`;
        });
        studies.forEach(s => {
          csv += `"Study","${(s.title||'').replace(/"/g, '""')}","RnD","${(s.details||'').replace(/"/g, '""')}","N/A","N/A","N/A","${s.urls||''}","${s.createdAt||''}"\n`;
        });
        mindsets.forEach(m => {
          csv += `"Mindset","${(m.title||'').replace(/"/g, '""')}","Executive","${(m.details||'').replace(/"/g, '""')}","N/A","N/A","N/A","${m.urls||''}","${m.createdAt||''}"\n`;
        });
        platforms.forEach(pl => {
          csv += `"Platform","${(pl.title||'').replace(/"/g, '""')}","${pl.category||''}","N/A","N/A","N/A","N/A","${pl.urls||''}","${pl.createdAt||''}"\n`;
        });

        const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csv);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `AI_CEO_Executive_Export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Copy for AI Context
      const handleCopyForAI = (item) => {
        let md = '';
        if (item) {
          md = `### [${item.category || 'Executive'}] ${item.title || item.details}\n`;
          if (item.company) md += `**Company**: ${item.company}\n`;
          if (item.objective) md += `**Targets**:\n${item.objective}\n`;
          if (item.aiPrompt) md += `**AI Prompts for Actions**:\n${item.aiPrompt}\n`;
          if (item.details) md += `**Details**: ${item.details}\n`;
          if (item.urls) md += `**URLs**: ${item.urls}\n`;
        } else if (selectedIds.size > 0) {
          const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
          const list = all.filter(i => selectedIds.has(i.id));
          md = `# ${branding.title} Executive Prompt & Selected Memory Context (${list.length})\nDate: ${new Date().toLocaleDateString()}\n\n`;
          if (instructionPrompt.trim()) {
            md += `## Executive Instruction / Directive:\n${instructionPrompt.trim()}\n\n---\n\n`;
          }
          md += `## Selected Items:\n`;
          list.forEach(i => {
            md += `- **[${i.category || 'Exec'}] ${i.title || i.details}** (${i.company || 'N/A'})\n  Objectives/Details:\n${i.objective || i.details || 'N/A'}\n  AI Context:\n${i.aiPrompt || 'N/A'}\n  URLs: ${i.urls || 'None'}\n\n`;
          });
        } else {
          md = `# ${branding.title} Executive Memory & Dashboard Context\n\n`;
          md += `## Projects (${projects.length})\n`;
          projects.forEach(p => {
            md += `- **[${p.category}] ${p.title}** (${p.company}) | Progress: ${p.progress}%\n  Objectives:\n${p.objective || 'N/A'}\n  Prompt:\n${p.aiPrompt || 'N/A'}\n  URLs: ${p.urls || 'None'}\n`;
          });
          md += `\n## Ideas (${ideas.length})\n`;
          ideas.forEach(i => {
            md += `- **[${i.category}] ${i.title}** | Stars: ${i.stars || 0}\n  Details: ${i.details || 'N/A'}\n`;
          });
        }

        navigator.clipboard.writeText(md);
        alert('Copied Markdown context to clipboard!');
      };

      // Sorting Generic Utility
      const sortItems = (items, sortKey) => {
        return [...items].sort((a, b) => {
          if (sortKey === 'Title') {
            return (a.title || a.details || '').localeCompare(b.title || b.details || '');
          }
          if (sortKey === 'Company') {
            return (a.company || '').localeCompare(b.company || '');
          }
          if (sortKey === 'Progress %') {
            return (b.progress || 0) - (a.progress || 0);
          }
          if (sortKey === 'Stars') {
            return (b.stars || 0) - (a.stars || 0);
          }
          if (sortKey === 'Start Date') {
            return new Date(b.startDate || '1970-01-01') - new Date(a.startDate || '1970-01-01');
          }
          // Default Date Sort
          return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
        });
      };

      // Filtered & Sorted Lists
      const processedProjects = useMemo(() => {
        const filtered = projects.filter(p => {
          const matchCat = selectedProjCat === 'All' || p.category === selectedProjCat;
          const matchQuery = !globalSearch.trim() ||
            p.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (p.company && p.company.toLowerCase().includes(globalSearch.toLowerCase())) ||
            (p.objective && p.objective.toLowerCase().includes(globalSearch.toLowerCase()));
          return matchCat && matchQuery;
        });
        return sortItems(filtered, sortProjectBy);
      }, [projects, selectedProjCat, globalSearch, sortProjectBy]);

      const processedIdeas = useMemo(() => {
        const filtered = ideas.filter(i => {
          const matchCat = selectedIdeaCat === 'All' || i.category === selectedIdeaCat;
          const matchQuery = !globalSearch.trim() ||
            i.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (i.details && i.details.toLowerCase().includes(globalSearch.toLowerCase()));
          return matchCat && matchQuery;
        });
        return sortItems(filtered, sortIdeaBy);
      }, [ideas, selectedIdeaCat, globalSearch, sortIdeaBy]);

      const processedStudies = useMemo(() => {
        const filtered = studies.filter(s => {
          return !globalSearch.trim() ||
            s.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (s.details && s.details.toLowerCase().includes(globalSearch.toLowerCase()));
        });
        return sortItems(filtered, sortStudyBy);
      }, [studies, globalSearch, sortStudyBy]);

      const processedMindsets = useMemo(() => {
        const filtered = mindsets.filter(m => {
          return !globalSearch.trim() ||
            m.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (m.details && m.details.toLowerCase().includes(globalSearch.toLowerCase()));
        });
        return sortItems(filtered, sortMindsetBy);
      }, [mindsets, globalSearch, sortMindsetBy]);

      // Global Search Live Dropdown Results
      const searchResults = useMemo(() => {
        if (!globalSearch.trim()) return [];
        const q = globalSearch.toLowerCase();
        const res = [];

        projects.forEach(p => {
          if (p.title.toLowerCase().includes(q) || (p.company && p.company.toLowerCase().includes(q))) {
            res.push({ type: 'projects', item: p, boxName: 'Projects', boxId: 'box-projects', category: p.category });
          }
        });
        ideas.forEach(i => {
          if (i.title.toLowerCase().includes(q) || (i.details && i.details.toLowerCase().includes(q))) {
            res.push({ type: 'ideas', item: i, boxName: 'Ideas', boxId: 'box-ideas', category: i.category });
          }
        });
        studies.forEach(s => {
          if (s.title.toLowerCase().includes(q) || (s.details && s.details.toLowerCase().includes(q))) {
            res.push({ type: 'studies', item: s, boxName: 'Study', boxId: 'box-study', category: 'RnD' });
          }
        });
        mindsets.forEach(m => {
          if (m.title.toLowerCase().includes(q) || (m.details && m.details.toLowerCase().includes(q))) {
            res.push({ type: 'mindsets', item: m, boxName: 'Mindset', boxId: 'box-mindset', category: 'Exec' });
          }
        });
        return res;
      }, [globalSearch, projects, ideas, studies, mindsets]);

      const headerRef = useRef(null);
      const [headerHeight, setHeaderHeight] = useState(44);

      useEffect(() => {
        const updateHeight = () => {
          if (headerRef.current) {
            setHeaderHeight(headerRef.current.offsetHeight);
          }
        };
        updateHeight();
        window.addEventListener('resize', updateHeight);
        return () => window.removeEventListener('resize', updateHeight);
      }, []);

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
      const scrollToBox = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      // Metrics Calculations
      const inProgressCount = projects.filter(p => p.status === 'In Progress').length;
      const threeStarProjectsCount = projects.filter(p => p.stars === 3).length;
      const threeStarIdeasCount = ideas.filter(i => i.stars === 3).length;

      return (
        <div className="min-h-screen bg-appbg text-textslate font-normal flex flex-col pb-20">

          {/* 1. FIXED/PINNED MAIN NAVIGATION BAR HEADER (Sticky top-0) */}
          <div ref={headerRef} className="sticky top-0 z-50 bg-appbg/95 backdrop-blur-md border-b border-gray-200 shadow-sm">
            <header className="max-w-6xl w-full mx-auto px-3 sm:px-4 py-1 sm:py-1.5 flex flex-wrap sm:flex-nowrap items-center justify-between gap-2 relative">
              
              {/* Logo / Branding Area */}
              <div className="flex items-center shrink-0">
                {branding.logoUrl && (
                  <img src={branding.logoUrl} alt="Logo" className="w-4 h-4 sm:w-5 sm:h-5 object-contain rounded shrink-0 mr-1.5 sm:mr-2" />
                )}

                {/* Main Title + Hover Edit ✏️ */}
                <div
                  onClick={() => setIsBrandingModalOpen(true)}
                  className="relative group flex items-center space-x-1 cursor-pointer select-none"
                  title="Click to Edit Title & Logo"
                >
                  <span className="font-bold text-sm sm:text-base text-darkslate hover:text-brandsky transition-colors">
                    {branding.title || 'CEO ActionNote'}
                  </span>
                  <span className="opacity-0 group-hover:opacity-100 transition-opacity text-xs text-slate-400">
                    ✏️
                  </span>
                </div>

                {/* Slogan + Hover Edit ✏️ (exactly 3 characters space away, formatted as "| Slogan") */}
                <div
                  onClick={() => setIsSloganModalOpen(true)}
                  className="relative group flex items-center space-x-0.5 cursor-pointer select-none ml-[3ch]"
                  title="Click to Edit Slogan"
                >
                  <span className="text-[10.5px] sm:text-[11.5px] text-grayholder font-normal hover:text-darkslate transition-colors whitespace-nowrap">
                    | {branding.slogan || 'Intelligence Workspace'}
                  </span>
                  <span className="opacity-0 group-hover:opacity-100 transition-opacity text-[10.5px] text-slate-400">
                    ✏️
                  </span>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="flex items-center flex-wrap gap-x-2 sm:gap-x-3 gap-y-1 text-[10px] font-normal ml-auto">
                <button onClick={() => setActiveSectionModal('projects')} className="font-bold text-brandsky hover:underline cursor-pointer text-[10px]">
                  Projects
                </button>
                <button onClick={() => setActiveSectionModal('ideas')} className="font-bold text-brandsky hover:underline cursor-pointer text-[10px]">
                  Idea/ Insight
                </button>
                <button onClick={() => setActiveSectionModal('studies')} className="font-bold text-brandsky hover:underline cursor-pointer text-[10px] whitespace-nowrap">

                  Mindfulness

                      <a
                        href="https://sc-sistarcompany.web.app"
                        target="_blank"

    // --- REUSABLE QUADRANT BOX COMPONENT ---
    // Displays ONLY actual created data rows (no empty placeholder rows)
    function QuadrantBox({ id, title, count, page, setPage, onAdd, headerControls, onClickBox, children }) {
      const pageSize = 20;
      const maxPages = Math.ceil(count / pageSize);
      const childArray = React.Children.toArray(children);

      const handleBoxClick = (e) => {
        const isRowItem = e.target.closest('.quadrant-row-item');
        const isInteractiveElement = e.target.closest('button, select, input, a, label');
        if (!isRowItem && !isInteractiveElement && onClickBox) {
          onClickBox();
        }
      };

      return (
        <section
          id={id}
          onClick={handleBoxClick}
          className="border border-gray-200 rounded-xl p-4 bg-white shadow-sm flex flex-col justify-between space-y-2 min-h-[300px] cursor-pointer hover:border-slate-300 hover:shadow-md transition-all"
        >
          
          {/* Box Header */}
          <div className="flex items-center justify-between border-b border-gray-100 pb-2">
            <div className="flex items-center space-x-2">
              <span className="font-bold text-[13px] text-brandsky">{title}</span>
              <button
                onClick={(e) => { e.stopPropagation(); onAdd(); }}
                className="px-1.5 py-0.5 rounded bg-sky-50 text-brandsky hover:bg-sky-100 text-xs font-bold transition-colors cursor-pointer"
                title="Add New Item"
              >
                +
              </button>
              <span className="text-[10.5px] text-grayholder">({count})</span>
            </div>

            <div className="flex items-center space-x-2" onClick={(e) => e.stopPropagation()}>
              {headerControls}
            </div>
          </div>

          {/* Rows Container - Only actual created data, no empty dots/dashes */}
          <div className="divide-y divide-gray-50 flex-1 min-h-[220px]">
            {childArray.length > 0 ? childArray : (
              <div className="py-12 text-center text-grayholder text-xs italic">
                No items in {title}. Click + to create a new item.
              </div>
            )}
          </div>

          {/* 20-Item Pagination Controls - ONLY active when count > 20 */}
          {count > 20 && (
            <div className="flex items-center justify-between pt-2 border-t border-gray-100 text-xs text-grayholder" onClick={(e) => e.stopPropagation()}>
              <span>Page {page + 1} of {maxPages}</span>
              <div className="space-x-2">
                <button
                  disabled={page === 0}
                  onClick={() => setPage(p => Math.max(0, p - 1))}
                  className="disabled:opacity-30 hover:text-darkslate cursor-pointer"
                >
                  [Prev]
                </button>
                <button
                  disabled={page >= maxPages - 1}
                  onClick={() => setPage(p => Math.min(maxPages - 1, p + 1))}
                  className="disabled:opacity-30 hover:text-darkslate cursor-pointer"
                >
                  [Next]
                </button>
              </div>
            </div>
          )}
        </section>
      );
    }

    // --- PROJECT EXECUTION CALENDAR MODAL COMPONENT ---
    function CalendarModal({ projects, onClose, onSaveProject, onEditProject }) {
      const [currentDate, setCurrentDate] = useState(new Date(2026, 7, 1)); // Default to August 2026 to match seed data
      const [selectedProjectForClickReschedule, setSelectedProjectForClickReschedule] = useState(null);

      // Helper to change month
      const prevMonth = () => {
        setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() - 1, 1));
      };
      const nextMonth = () => {
        setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() + 1, 1));
      };

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Days in month
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayIndex = new Date(year, month, 1).getDay();

      // Split projects into scheduled and unscheduled
      const unscheduledProjects = useMemo(() => {
        return projects.filter(p => !p.startDate);
      }, [projects]);

      const scheduledProjects = useMemo(() => {
        return projects.filter(p => p.startDate);
      }, [projects]);

      // Group scheduled projects by date string "YYYY-MM-DD"
      const projectsByDate = useMemo(() => {
        const groups = {};
        scheduledProjects.forEach(p => {
          const dateStr = p.startDate;
          if (!groups[dateStr]) groups[dateStr] = [];
          groups[dateStr].push(p);
        });
        return groups;
      }, [scheduledProjects]);

      // Handle Drag & Drop
      const handleDragStart = (e, projectId) => {
        e.dataTransfer.setData('text/plain', projectId);
      };

      const handleDrop = (e, dateStr) => {
        e.preventDefault();
        const projectId = e.dataTransfer.getData('text/plain');
        if (!projectId) return;

        const project = projects.find(p => p.id === projectId);
        if (project) {
          const updated = { ...project, startDate: dateStr };
          onSaveProject(updated);
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      // Click-to-Reschedule Handler
      const handleCellClick = (dateStr) => {
        if (selectedProjectForClickReschedule) {
          const updated = { ...selectedProjectForClickReschedule, startDate: dateStr };
          onSaveProject(updated);
          setSelectedProjectForClickReschedule(null);
        }
      };

      // Render Calendar Cells
      const cells = [];
      // Empty cells for first week offset
      for (let i = 0; i < firstDayIndex; i++) {
        cells.push(<div key={`empty-${i}`} className="bg-slate-50 border border-gray-100 min-h-[70px] p-1"></div>);
      }

      // Active days
      for (let day = 1; day <= daysInMonth; day++) {
        const dayStr = day < 10 ? `0${day}` : `${day}`;
        const monthStr = (month + 1) < 10 ? `0${month + 1}` : `${month + 1}`;
        const dateStr = `${year}-${monthStr}-${dayStr}`;
        const dayProjects = projectsByDate[dateStr] || [];

        cells.push(
          <div
            key={`day-${day}`}
            onDragOver={handleDragOver}
            onDrop={(e) => handleDrop(e, dateStr)}
            onClick={() => handleCellClick(dateStr)}
            className={`bg-white border border-gray-100 min-h-[75px] p-1 flex flex-col justify-between transition-all hover:bg-sky-50/20 cursor-pointer ${
              selectedProjectForClickReschedule ? 'ring-1 ring-brandsky/40 hover:bg-sky-50' : ''
            }`}
          >
            <div className="flex items-center justify-between">
              <span className="font-bold text-slate-700 text-[11px]">{day}</span>
              {selectedProjectForClickReschedule && (
                <span className="text-[8px] text-brandsky animate-pulse">Schedule</span>
              )}
            </div>

            <div className="flex-1 overflow-y-auto space-y-1 mt-1">
              {dayProjects.map(proj => (
                <div
                  key={proj.id}
                  draggable="true"
                  onDragStart={(e) => handleDragStart(e, proj.id)}
                  onClick={(e) => {
                    e.stopPropagation();
                    onEditProject(proj);
                  }}
                  className={`p-1 rounded text-[9.5px] font-bold leading-tight truncate shadow-sm transition-transform cursor-grab active:cursor-grabbing hover:scale-[1.02] ${
                    proj.status === 'Completed'
                      ? 'bg-emerald-50 text-emerald-700 border border-emerald-100'
                      : proj.status === 'On Hold'
                      ? 'bg-amber-50 text-amber-700 border border-amber-100'
                      : 'bg-sky-50 text-brandsky border border-sky-100'
                  }`}
                  title={`${proj.title} (${proj.company || 'No Company'}) - Progress: ${proj.progress || 0}%`}
                >
                  <div className="truncate">{proj.title}</div>
                  <div className="text-[7.5px] opacity-80 font-normal truncate">{proj.company}</div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // Fill in empty cells for last week offset to make clean grid
      const totalCells = cells.length;
      const remainingCells = 42 - totalCells; // 6 rows standard
      const actualRemaining = remainingCells >= 7 ? remainingCells - 7 : remainingCells;
      for (let i = 0; i < (remainingCells > 7 ? remainingCells - 7 : remainingCells); i++) {
        cells.push(<div key={`empty-end-${i}`} className="bg-slate-50 border border-gray-100 min-h-[70px] p-1"></div>);
      }

      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      return (
        <div className="fixed inset-0 z-[60] modal-backdrop flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
          <div className="bg-white rounded-xl shadow-2xl max-w-4xl w-full p-4 sm:p-6 space-y-4 border border-gray-200 my-4 max-h-[92vh] flex flex-col text-xs font-normal">
            
            {/* Header */}
            <div className="flex items-center justify-between border-b border-gray-100 pb-2.5">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📅</span>
                <div>
                  <span className="font-bold text-sm text-darkslate block">Project Execution Calendar</span>
                  <p className="text-[10px] text-grayholder">Drag-and-drop projects to reschedule. Click a project to edit details.</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-darkslate text-sm font-bold cursor-pointer">
                ✕
              </button>
            </div>

            {/* Workspace Grid */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 flex-1 overflow-hidden min-h-0">
              
              {/* Sidebar: Unscheduled & Actions */}
              <div className="md:col-span-1 bg-slate-50 p-3 rounded-lg border border-slate-100 flex flex-col overflow-hidden">
                <span className="font-bold text-slate-700 block mb-2 text-[11px] uppercase tracking-wider">Unscheduled Projects</span>
                
                <div className="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[120px]">
                  {unscheduledProjects.length === 0 ? (
                    <div className="text-[10.5px] text-grayholder italic text-center py-8">
                      All projects are scheduled. Drag calendar items to reschedule them.
                    </div>
                  ) : (
                    unscheduledProjects.map(proj => (
                      <div
                        key={proj.id}
                        draggable="true"
                        onDragStart={(e) => handleDragStart(e, proj.id)}
                        onClick={() => {
                          if (selectedProjectForClickReschedule?.id === proj.id) {
                            setSelectedProjectForClickReschedule(null);
                          } else {
                            setSelectedProjectForClickReschedule(proj);
                          }
                        }}
                        className={`p-2 rounded-lg border bg-white shadow-sm transition-all cursor-grab active:cursor-grabbing hover:shadow-md ${
                          selectedProjectForClickReschedule?.id === proj.id
                            ? 'ring-2 ring-brandsky border-brandsky bg-sky-50/30'
                            : 'border-gray-200'
                        }`}
                      >
                        <div className="font-bold text-darkslate text-[11px] truncate">{proj.title}</div>
                        <div className="text-[9.5px] text-grayholder truncate">{proj.company || 'No Company'}</div>
                        <div className="flex items-center justify-between mt-1 text-[8.5px]">
                          <span className="bg-sky-50 text-brandsky px-1 py-0.5 rounded font-bold">{proj.category}</span>
                          <span className="text-slate-500 font-medium">{proj.progress || 0}%</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {selectedProjectForClickReschedule && (
                  <div className="mt-3 bg-sky-50 p-2 rounded border border-sky-100 text-[10px] text-brandsky animate-pulse font-medium">
                    👉 Click any calendar day cell to assign schedule date.
                  </div>
                )}
              </div>

              {/* Main Calendar View */}
              <div className="md:col-span-3 flex flex-col overflow-hidden">
                
                {/* Calendar Controls */}
                <div className="flex items-center justify-between pb-3">
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={prevMonth}
                      className="px-2.5 py-1 border border-gray-200 rounded hover:bg-slate-50 font-bold text-slate-700 cursor-pointer"
                    >
                      ◀ Prev
                    </button>
                    <span className="font-bold text-sm text-darkslate min-w-[120px] text-center">
                      {monthNames[month]} {year}
                    </span>
                    <button
                      onClick={nextMonth}
                      className="px-2.5 py-1 border border-gray-200 rounded hover:bg-slate-50 font-bold text-slate-700 cursor-pointer"

                      Next ▶

                  </div>

                  {/* Status Indicators */}
                  <div className="flex items-center space-x-2 text-[9.5px]">
                    <span className="flex items-center space-x-1">
                      <span className="w-2 h-2 rounded-full bg-sky-500"></span>
                      <span className="text-slate-500">In Progress</span>
                    </span>

                    </span>

                      <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                      <span className="text-slate-500">On Hold</span>
                    </span>
                  </div>
                </div>

                {/* Grid Container */}
                <div className="flex-1 flex flex-col min-h-0">
                  
                  {/* Day Headers */}
                  <div className="grid grid-cols-7 gap-1 text-center font-bold text-slate-500 border-b border-gray-100 pb-1 mb-1">
                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (

                    {cells}

                </div>

              </div>

            </div>

            {/* Footer actions */}
            <div className="flex justify-end pt-2 border-t border-gray-100">
              <button

    // --- MARKDOWN EXPORT MODAL ---
    function MarkdownExportModal({ data, onClose }) {
      const [copied, setCopied] = useState(false);

      const handleCopy = () => {
        navigator.clipboard.writeText(data.content);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleDownload = () => {
        const blob = new Blob([data.content], { type: 'text/markdown;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `AI_CEO_Executive_Export_${new Date().toISOString().split('T')[0]}.md`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="fixed inset-0 z-[60] modal-backdrop flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-5 space-y-3 border border-gray-200 my-4 max-h-[85vh] flex flex-col">

                  <span>Progress Percentage</span>
                  <span className="text-brandsky font-bold text-base">{val}%</span>
                </div>

                <input
                  type="range"
                  min="0"
                  max="100"
                  step="5"
                  value={val}
                  onChange={(e) => setVal(parseInt(e.target.value))}
                  className="w-full cursor-pointer h-2 bg-slate-200 rounded-lg appearance-none accent-brandsky"
                />

                <div className="flex justify-between gap-1 pt-1">
                  {[0, 25, 50, 75, 100].map(pct => (
                    <button
                      key={pct}
                      type="button"
                      onClick={() => setVal(pct)}
                      className={`flex-1 py-1 rounded text-[11px] font-bold border transition-colors cursor-pointer ${
                        val === pct
                          ? 'bg-brandsky text-white border-brandsky'
                          : 'bg-slate-50 text-slate-600 border-gray-200 hover:bg-slate-100'
                      }`}
                    >
                      {pct}%
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex items-center justify-end space-x-2 pt-3 border-t border-gray-100">
              <button onClick={onClose} className="px-3.5 py-1.5 border border-gray-200 rounded text-slate-600 hover:bg-slate-50 cursor-pointer">
                Cancel
              </button>
              <button
                onClick={() => onApply(val)}
                className="px-4 py-1.5 bg-brandsky text-white rounded font-medium hover:bg-sky-600 transition-colors cursor-pointer"
              >
                Apply to {count} Items
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Dynamic CEO Action Manager Modal (Dynamic Action Brain)
    function CEOActionManagerModal({ actions, onClose, onSave, onReset }) {
      const [actionList, setActionList] = useState(actions || []);
      const [editingId, setEditingId] = useState(null);
      const [formData, setFormData] = useState({
        title: '',
        directive: '',
        tooltip: '',
        type: 'ai',
        highlight: false,
        danger: false
      });

      const handleStartEdit = (act) => {
        setEditingId(act.id);
        setFormData({
          title: act.title || '',
          directive: act.directive || '',
          tooltip: act.tooltip || '',
          type: act.type || 'ai',
          highlight: !!act.highlight,
          danger: !!act.danger
        });
      };

      const handleCancelForm = () => {
        setEditingId(null);
        setFormData({ title: '', directive: '', tooltip: '', type: 'ai', highlight: false, danger: false });
      };

      const handleSaveForm = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;

        if (editingId) {
          setActionList(prev => prev.map(a => a.id === editingId ? { ...a, ...formData } : a));
        } else {
          const newAct = {
            id: `act_custom_${Date.now()}`,
            ...formData
          };
          setActionList(prev => [...prev, newAct]);
        }
        handleCancelForm();
      };

      const handleDeleteAction = (id) => {
        if (actionList.length <= 1) {
          alert('You must keep at least one action button.');
          return;
        }
        setActionList(prev => prev.filter(a => a.id !== id));
        if (editingId === id) handleCancelForm();
      };

      const handleMove = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= actionList.length) return;
        const updated = [...actionList];
        const temp = updated[index];
        updated[index] = updated[targetIndex];
        updated[targetIndex] = temp;
        setActionList(updated);
      };

      const handleFinalSave = () => {
        onSave(actionList);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 text-[11.5px] font-normal">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden border border-slate-200">
            
            {/* Modal Header */}
            <div className="bg-darkslate text-white p-3.5 px-4 flex items-center justify-between border-b border-slate-700">
              <div>
                <h3 className="text-[11.5px] font-normal text-slate-100 flex items-center gap-1">
                  CEO Actions, powered by Qubit Algorithm<sup className="align-super font-normal text-brandsky ml-0.5" style={{ fontSize: '2.5px' }}>TM</sup>
                </h3>
                <p className="text-[10.5px] text-slate-400 font-normal mt-0.5">
                  Dynamic Action Brain: Customize, add, or reorder executive actions in the floating bar
                </p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-base font-normal leading-none cursor-pointer">
                ✕
              </button>
            </div>

            {/* Modal Body */}
            <div className="p-4 overflow-y-auto space-y-4 flex-1 text-[11.5px] font-normal text-slate-700">
              
              {/* Active Actions List */}
              <div className="space-y-2">
                <div className="flex items-center justify-between text-slate-500 font-normal">
                  <span>Current Action Buttons ({actionList.length})</span>
                  <button
                    type="button"
                    onClick={onReset}
                    className="text-red-500 hover:underline cursor-pointer text-[11.5px] font-normal"
                  >
                    Reset Defaults
                  </button>
                </div>

                <div className="space-y-1.5 max-h-52 overflow-y-auto pr-1">
                  {actionList.map((act, idx) => (
                    <div
                      key={act.id}
                      className={`flex items-center justify-between p-2 rounded-lg border transition-colors ${
                        editingId === act.id ? 'bg-sky-50 border-brandsky' : 'bg-slate-50 border-slate-200 hover:bg-slate-100/80'
                      }`}
                    >
                      <div className="flex items-center gap-2 overflow-hidden flex-1 mr-2">
                        <span className={`px-2 py-0.5 rounded text-[10.5px] font-normal shrink-0 ${
                          act.highlight ? 'bg-brandsky text-white' : act.danger ? 'bg-red-800 text-red-100' : 'bg-slate-700 text-white'
                        }`}>
                          {act.title}
                        </span>
                        <span className="text-slate-500 truncate text-[11.5px] font-normal" title={act.directive || act.tooltip}>
                          {act.type === 'ai' ? (act.directive || act.tooltip) : `[System: ${act.type}] ${act.tooltip}`}
                        </span>
                      </div>

                      <div className="flex items-center gap-1 shrink-0">
                        <button
                          type="button"
                          onClick={() => handleMove(idx, -1)}
                          disabled={idx === 0}
                          className="px-1.5 py-0.5 border rounded bg-white hover:bg-slate-100 disabled:opacity-30 text-slate-600 cursor-pointer"
                          title="Move Up"
                        >
                          ▲
                        </button>
                        <button
                          type="button"
                          onClick={() => handleMove(idx, 1)}
                          disabled={idx === actionList.length - 1}
                          className="px-1.5 py-0.5 border rounded bg-white hover:bg-slate-100 disabled:opacity-30 text-slate-600 cursor-pointer"
                          title="Move Down"
                        >
                          ▼
                        </button>
                        <button
                          type="button"
                          onClick={() => handleStartEdit(act)}
                          className="px-2 py-0.5 border rounded bg-white hover:bg-sky-50 text-brandsky border-slate-200 cursor-pointer text-[11.5px] font-normal"
                        >
                          Edit
                        </button>
                        <button
                          type="button"
                          onClick={() => handleDeleteAction(act.id)}
                          className="px-2 py-0.5 border rounded bg-white hover:bg-red-50 text-red-600 border-slate-200 cursor-pointer text-[11.5px] font-normal"
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Add / Edit Form */}
              <form onSubmit={handleSaveForm} className="border border-slate-200 rounded-xl p-3.5 bg-slate-50/60 space-y-3">
                <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                  <span className="text-slate-700 font-normal">
                    {editingId ? 'Edit Action Button' : 'Add New CEO Action Button'}
                  </span>
                  {editingId && (
                    <button
                      type="button"
                      onClick={handleCancelForm}
                      className="text-slate-500 hover:text-slate-700 underline text-[11.5px] font-normal cursor-pointer"
                    >
                      Cancel Edit
                    </button>
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-slate-600 font-normal mb-1">
                      Button Title
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. Market Expansion"
                      value={formData.title}
                      onChange={(e) => setFormData(prev => ({ ...prev, title: e.target.value }))}
                      required
                      className="w-full border border-slate-300 rounded-lg p-2 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brandsky text-[11.5px] font-normal"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-600 font-normal mb-1">
                      Action Type
                    </label>
                    <select
                      value={formData.type}
                      onChange={(e) => setFormData(prev => ({ ...prev, type: e.target.value }))}
                      className="w-full border border-slate-300 rounded-lg p-2 bg-white text-slate-800 focus:outline-none focus:border-brandsky text-[11.5px] font-normal"
                    >
                      <option value="ai">AI Gemini Directive Prompt</option>
                      <option value="export_md">System: Export Markdown</option>
                      <option value="bulk_status">System: Bulk Status Update</option>
                      <option value="send_email">System: Send via Email</option>
                      <option value="delete">System: Delete Selected</option>
                    </select>
                  </div>
                </div>

                {formData.type === 'ai' && (
                  <div>
                    <label className="block text-slate-600 font-normal mb-1">
                      Action Directive / AI System Role
                    </label>
                    <textarea
                      rows="3"
                      placeholder="e.g. Analyze selected items for ROI, competitor advantages, and execution bottlenecks."
                      value={formData.directive}
                      onChange={(e) => setFormData(prev => ({ ...prev, directive: e.target.value }))}
                      className="w-full border border-slate-300 rounded-lg p-2 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brandsky text-[11.5px] font-normal resize-y"
                    />
                  </div>
                )}

                <div>
                  <label className="block text-slate-600 font-normal mb-1">
                    Tooltip Description (English Guidance)
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. Analyze market viability and return on investment"
                    value={formData.tooltip}
                    onChange={(e) => setFormData(prev => ({ ...prev, tooltip: e.target.value }))}
                    className="w-full border border-slate-300 rounded-lg p-2 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brandsky text-[11.5px] font-normal"
                  />
                </div>

                <div className="flex items-center gap-4 text-[11.5px] font-normal pt-1">
                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={formData.highlight}
                      onChange={(e) => setFormData(prev => ({ ...prev, highlight: e.target.checked }))}
                      className="rounded text-brandsky focus:ring-0"
                    />
                    <span>Highlight Button (Sky Blue)</span>
                  </label>

                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={formData.danger}
                      onChange={(e) => setFormData(prev => ({ ...prev, danger: e.target.checked }))}
                      className="rounded text-red-600 focus:ring-0"
                    />
                    <span>Warning Style (Red)</span>
                  </label>
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    type="submit"
                    className="px-4 py-1.5 bg-brandsky text-white rounded-lg font-normal hover:bg-sky-600 transition-colors cursor-pointer text-[11.5px]"
                  >
                    {editingId ? 'Update Action Button' : '+ Add Action Button'}
                  </button>
                </div>
              </form>

            </div>

            {/* Modal Footer */}
            <div className="p-3 px-4 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2 text-[11.5px] font-normal">
              <button
                type="button"
                onClick={onClose}
                className="px-3.5 py-1.5 border border-slate-300 rounded-lg text-slate-600 hover:bg-white cursor-pointer font-normal"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={handleFinalSave}
                className="px-4 py-1.5 bg-darkslate text-white rounded-lg hover:bg-slate-800 transition-colors cursor-pointer font-normal"
              >
                Save Action Changes
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Render React App to Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
