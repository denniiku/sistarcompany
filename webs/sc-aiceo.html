    // --- Helper Component: Multi-URL Inline Renderer ---
    const InlineUrls = ({ urls }) => {
      if (!urls) return null;
      const list = typeof urls === 'string' 
        ? urls.split(',').map(u => u.trim()).filter(Boolean)
        : Array.isArray(urls) ? urls : [];

      if (list.length === 0) return null;

      return (
        <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-cyan-400 font-mono">
          {list.map((url, idx) => {
            let label = `Link ${idx + 1}`;
            try {
              const parsed = new URL(url.startsWith('http') ? url : `https://${url}`);
              label = parsed.hostname.replace('www.', '');
            } catch (e) {}

            const href = url.startsWith('http') ? url : `https://${url}`;

            return (
              <span key={idx} className="inline-flex items-center space-x-1">
                <span className="text-slate-500 font-sans text-[11px]">▫️</span>
                <a
                  href={href}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="hover:underline hover:text-cyan-300 font-medium inline-flex items-center space-x-1"
                >
                  <span>{label}</span>
                  <Icon name="externalLink" className="w-2.5 h-2.5 opacity-70" />
                </a>
                {idx < list.length - 1 && <span className="text-slate-600">,</span>}
              </span>
            );
          })}
        </div>
      );

    // --- MAIN APP COMPONENT ---
    function App() {
      // Firebase User State
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);

      // Firebase Config State
      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        const saved = localStorage.getItem('ai_ceo_firebase_config');
        return saved ? JSON.parse(saved) : null;
      });
      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);

      // Data States
      const [companyProfile, setCompanyProfile] = useState(DEFAULT_PROFILE);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [projects, setProjects] = useState(DEFAULT_PROJECTS);
      const [ideas, setIdeas] = useState(DEFAULT_IDEAS);
      const [studies, setStudies] = useState(DEFAULT_STUDIES);
      const [mindsets, setMindsets] = useState(DEFAULT_MINDSETS);
      const [platforms, setPlatforms] = useState(DEFAULT_PLATFORMS);

      // Selection State for Bulk Mail Send
      const [selectedItemIds, setSelectedItemIds] = useState(new Set());

      // Search & Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedCompanyFilter, setSelectedCompanyFilter] = useState('All');
      const [selectedStatusFilter, setSelectedStatusFilter] = useState('All');
      const [onlyStarred, setOnlyStarred] = useState(false);

      // Modals State
      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [editingProject, setEditingProject] = useState(null);

      const [isIdeaModalOpen, setIsIdeaModalOpen] = useState(false);
      const [editingIdea, setEditingIdea] = useState(null);

      const [isStudyModalOpen, setIsStudyModalOpen] = useState(false);
      const [isMindsetModalOpen, setIsMindsetModalOpen] = useState(false);
      const [isPlatformModalOpen, setIsPlatformModalOpen] = useState(false);
      const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);

      // Scroll To Top
      const [showScrollTop, setShowScrollTop] = useState(false);

      // Initialize Firebase App
      useEffect(() => {
        if (firebaseConfig && firebaseConfig.apiKey) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(firebaseConfig);
            }
            const authInstance = firebase.auth();
            const dbInstance = firebase.firestore();
            setAuth(authInstance);
            setDb(dbInstance);

            const unsubscribe = authInstance.onAuthStateChanged((currUser) => {
              setUser(currUser);
              setAuthLoading(false);
            });
            return () => unsubscribe();
          } catch (err) {
            console.error('Firebase init error:', err);
            setAuthLoading(false);
          }
        } else {
          setAuthLoading(false);
        }
      }, [firebaseConfig]);

      // Load Local Data Fallback if no user
      useEffect(() => {
        if (!user) {
          const lp = localStorage.getItem('ai_ceo_projects');
          if (lp) setProjects(JSON.parse(lp));
          const li = localStorage.getItem('ai_ceo_ideas');
          if (li) setIdeas(JSON.parse(li));
          const ls = localStorage.getItem('ai_ceo_studies');
          if (ls) setStudies(JSON.parse(ls));
          const lm = localStorage.getItem('ai_ceo_mindsets');
          if (lm) setMindsets(JSON.parse(lm));
          const lplat = localStorage.getItem('ai_ceo_platforms');
          if (lplat) setPlatforms(JSON.parse(lplat));
          const lcat = localStorage.getItem('ai_ceo_categories');
          if (lcat) setCategories(JSON.parse(lcat));
          const lprof = localStorage.getItem('ai_ceo_profile');
          if (lprof) setCompanyProfile(JSON.parse(lprof));
        }
      }, [user]);

      // Sync Firestore when User is Authenticated
      useEffect(() => {
        if (user && db) {
          const userRef = db.collection('users').doc(user.uid);

          // Subscriptions for collections
          const unsubProj = userRef.collection('projects').onSnapshot((snap) => {
            if (!snap.empty) {
              const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setProjects(list);
            }
          });

          const unsubIdeas = userRef.collection('ideas').onSnapshot((snap) => {
            if (!snap.empty) {
              const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setIdeas(list);
            }
          });

          const unsubStudies = userRef.collection('studies').onSnapshot((snap) => {
            if (!snap.empty) {
              const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setStudies(list);
            }
          });

          const unsubMindsets = userRef.collection('mindsets').onSnapshot((snap) => {
            if (!snap.empty) {
              const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setMindsets(list);
            }
          });

          const unsubPlat = userRef.collection('platforms').onSnapshot((snap) => {
            if (!snap.empty) {
              const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setPlatforms(list);
            }
          });

          const unsubProfile = userRef.doc().onSnapshot(() => {}); // Optional

          return () => {
            unsubProj();
            unsubIdeas();
            unsubStudies();
            unsubMindsets();
            unsubPlat();
          };
        }
      }, [user, db]);

      // Scroll Event Listener
      useEffect(() => {
        const handleScroll = () => {
          setShowScrollTop(window.scrollY > 120);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Helpers to save data to Firestore or LocalStorage
      const saveEntity = async (collectionName, item) => {
        const today = new Date().toISOString().split('T')[0];
        const newItem = { ...item, updatedAt: today };

        if (user && db) {
          const colRef = db.collection('users').doc(user.uid).collection(collectionName);
          if (newItem.id) {
            await colRef.doc(newItem.id).set(newItem, { merge: true });
          } else {
            await colRef.add(newItem);
          }
        } else {
          // LocalStorage fallback
          const id = newItem.id || `${collectionName}-${Date.now()}`;
          const finalItem = { ...newItem, id };

          let updater;
          if (collectionName === 'projects') {
            updater = (prev) => {
              const exists = prev.some(p => p.id === id);
              const list = exists ? prev.map(p => p.id === id ? finalItem : p) : [finalItem, ...prev];
              localStorage.setItem('ai_ceo_projects', JSON.stringify(list));
              return list;
            };
            setProjects(updater);
          } else if (collectionName === 'ideas') {
            updater = (prev) => {
              const list = [finalItem, ...prev.filter(i => i.id !== id)];
              localStorage.setItem('ai_ceo_ideas', JSON.stringify(list));
              return list;
            };
            setIdeas(updater);
          } else if (collectionName === 'studies') {
            updater = (prev) => {
              const list = [finalItem, ...prev.filter(s => s.id !== id)];
              localStorage.setItem('ai_ceo_studies', JSON.stringify(list));
              return list;
            };
            setStudies(updater);
          } else if (collectionName === 'mindsets') {
            updater = (prev) => {
              const list = [finalItem, ...prev.filter(m => m.id !== id)];
              localStorage.setItem('ai_ceo_mindsets', JSON.stringify(list));
              return list;
            };
            setMindsets(updater);
          } else if (collectionName === 'platforms') {
            updater = (prev) => {
              const list = [finalItem, ...prev.filter(p => p.id !== id)];
              localStorage.setItem('ai_ceo_platforms', JSON.stringify(list));
              return list;
            };
            setPlatforms(updater);
          }
        }
      };

      const deleteEntity = async (collectionName, id) => {
        if (user && db) {
          await db.collection('users').doc(user.uid).collection(collectionName).doc(id).delete();
        } else {
          if (collectionName === 'projects') {
            const list = projects.filter(p => p.id !== id);
            setProjects(list);
            localStorage.setItem('ai_ceo_projects', JSON.stringify(list));
          } else if (collectionName === 'ideas') {
            const list = ideas.filter(i => i.id !== id);
            setIdeas(list);
            localStorage.setItem('ai_ceo_ideas', JSON.stringify(list));
          } else if (collectionName === 'studies') {
            const list = studies.filter(s => s.id !== id);
            setStudies(list);
            localStorage.setItem('ai_ceo_studies', JSON.stringify(list));
          } else if (collectionName === 'mindsets') {
            const list = mindsets.filter(m => m.id !== id);
            setMindsets(list);
            localStorage.setItem('ai_ceo_mindsets', JSON.stringify(list));
          } else if (collectionName === 'platforms') {
            const list = platforms.filter(p => p.id !== id);
            setPlatforms(list);
            localStorage.setItem('ai_ceo_platforms', JSON.stringify(list));
          }
        }
      };

      // Toggle Star
      const handleToggleStar = (id) => {
        const proj = projects.find(p => p.id === id);
        if (proj) {
          saveEntity('projects', { ...proj, isStarred: !proj.isStarred });
        }
      };

      // Update Progress
      const handleUpdateProgress = (id, newProg) => {
        const proj = projects.find(p => p.id === id);
        if (proj) {
          let st = proj.status;
          if (newProg === 100) st = 'Completed';
          else if (proj.status === 'Completed' && newProg < 100) st = 'In Progress';
          saveEntity('projects', { ...proj, progress: newProg, status: st });
        }
      };

      // Selection Checkbox Toggle
      const toggleItemSelection = (id) => {
        setSelectedItemIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      // Bulk Email Sender
      const handleSendSelectedViaEmail = () => {
        if (selectedItemIds.size === 0) return;

        const allItems = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = allItems.filter(item => selectedItemIds.has(item.id));

        let bodyText = `AI-CEO Executive Summary Report\nCompany: ${companyProfile.companyName}\nDate: ${new Date().toLocaleDateString()}\n\n`;
        selectedList.forEach((item, index) => {
          bodyText += `${index + 1}. [${item.category || 'General'}] ${item.title || 'Untitled'}\n`;
          if (item.company) bodyText += `   Company: ${item.company}\n`;
          if (item.status) bodyText += `   Status: ${item.status} (${item.progress}%)\n`;
          if (item.description || item.content || item.summary || item.quote) {
            bodyText += `   Details: ${item.description || item.content || item.summary || item.quote}\n`;
          }
          if (item.urls) bodyText += `   URLs: ${item.urls}\n`;
          bodyText += `\n`;
        });

        const mailtoUrl = `mailto:?subject=${encodeURIComponent(`[AI-CEO Report] ${companyProfile.companyName} Updates`)}&body=${encodeURIComponent(bodyText)}`;
        window.location.href = mailtoUrl;
      };

      // CSV Exporter
      const handleExportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,Type,Title,Category,Company/Details,Status/Progress,URLs,Date\n";

        projects.forEach(p => {
          csvContent += `"Project","${(p.title||'').replace(/"/g, '""')}","${p.category||''}","${p.company||''}","${p.status} (${p.progress}%)","${p.urls||''}","${p.updatedAt||''}"\n`;
        });
        ideas.forEach(i => {
          csvContent += `"Idea","${(i.title||'').replace(/"/g, '""')}","${i.category||''}","${(i.content||'').replace(/"/g, '""')}","N/A","${i.urls||''}","${i.createdAt||''}"\n`;
        });
        studies.forEach(s => {
          csvContent += `"Study","${(s.title||'').replace(/"/g, '""')}","${s.category||''}","${(s.summary||'').replace(/"/g, '""')}","N/A","${s.urls||''}","${s.createdAt||''}"\n`;
        });
        mindsets.forEach(m => {
          csvContent += `"Mindset","${(m.title||'').replace(/"/g, '""')}","${m.category||''}","${(m.quote||'').replace(/"/g, '""')}","N/A","N/A","${m.createdAt||''}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `AI_CEO_Executive_Export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Copy Markdown for AI
      const handleCopyForAI = () => {
        let md = `# AI-CEO Executive Context & Memory\nCompany: ${companyProfile.companyName}\n\n`;
        md += `## Daily Focus Mindset\n> ${companyProfile.dailyFocus}\n\n`;

        md += `## Projects (${projects.length})\n`;
        projects.forEach(p => {
          md += `- **[${p.category}] ${p.title}** (${p.company}) | Status: ${p.status} (${p.progress}%)\n  - Note: ${p.description || 'N/A'}\n  - URLs: ${p.urls || 'None'}\n`;
        });

        md += `\n## Ideas (${ideas.length})\n`;
        ideas.forEach(i => {
          md += `- **[${i.category}] ${i.title}**: ${i.content} | URLs: ${i.urls || 'None'}\n`;
        });

        navigator.clipboard.writeText(md);
        alert('Copied Markdown digest for AI to clipboard!');
      };

      // Distinct Companies for Filter
      const distinctCompanies = useMemo(() => {
        return Array.from(new Set(projects.map(p => p.company ? p.company.trim() : 'Unassigned'))).sort();
      }, [projects]);

      // Filtered Projects List
      const filteredProjects = useMemo(() => {
        return projects.filter(p => {
          const matchCat = selectedCategory === 'All' || p.category === selectedCategory;
          const matchComp = selectedCompanyFilter === 'All' || (p.company || 'Unassigned') === selectedCompanyFilter;
          const matchStat = selectedStatusFilter === 'All' || p.status === selectedStatusFilter;
          const matchStar = !onlyStarred || Boolean(p.isStarred);
          const matchSearch = !searchQuery.trim() || 
            p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.company.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.description.toLowerCase().includes(searchQuery.toLowerCase());

          return matchCat && matchComp && matchStat && matchStar && matchSearch;
        });
      }, [projects, selectedCategory, selectedCompanyFilter, selectedStatusFilter, onlyStarred, searchQuery]);

      // Auth Handlers
      const handleGoogleLogin = async () => {
        if (!auth) {
          setIsConfigModalOpen(true);
          return;
        }
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithPopup(provider);
          setIsAuthModalOpen(false);
        } catch (err) {
          alert('Google Login Error: ' + err.message);
        }
      };

      const handleEmailAuth = async (e, isSignUp, email, password) => {
        e.preventDefault();
        if (!auth) {
          setIsConfigModalOpen(true);
          return;
        }
        try {
          if (isSignUp) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
          setIsAuthModalOpen(false);
        } catch (err) {
          alert('Authentication Error: ' + err.message);
        }
      };

      const handleSignOut = () => {
        if (auth) auth.signOut();
      };

      return (
        <div className="min-h-screen bg-space-950 flex flex-col font-sans pb-16">
          
          {/* 1. STICKY TOP NAVIGATION BAR */}

              {/* Brand Logo & Title */}

                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-lg neon-border-cyan overflow-hidden">
                  {companyProfile.logoUrl ? (
                    <img src={companyProfile.logoUrl} alt="Logo" className="w-full h-full object-cover" />

                    <Icon name="sparkles" className="w-5 h-5 text-cyan-300" />

                </div>
                <div>
                  <div className="flex items-center space-x-2">

                      AI-CEO Dashboard

                    <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                      v3.0 Space Glass

                  </div>
                  <p className="text-[11px] text-slate-400 font-medium">
                    {companyProfile.companyName} • Executive Management System

                </div>

              {/* Action Toolbar */}
              <div className="flex items-center space-x-2">
                <button

                <button

                  title="Export all data to CSV file"

                  <Icon name="download" className="w-3.5 h-3.5 text-emerald-400" />

                </button>

                {/* Auth Button */}
                {user ? (
                  <button

                  >
                    <Icon name="logOut" className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">{user.email?.split('@')[0]}</span>
                  </button>
                ) : (
                  <button
                    onClick={() => setIsAuthModalOpen(true)}
                    className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-slate-950 font-bold text-xs transition-all shadow-md flex items-center space-x-1"
                  >
                    <Icon name="logIn" className="w-3.5 h-3.5" />
                    <span>Firebase Auth</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* 2. MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-5 space-y-6">

            {/* Daily Focus Mindset Neon Banner */}
            <div className="glass-card rounded-2xl p-4 border border-cyan-500/30 bg-gradient-to-r from-slate-900/90 via-indigo-950/40 to-slate-900/90 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-lg">
              <div className="flex items-center space-x-3">
                <div className="w-8 h-8 rounded-xl bg-cyan-500/20 border border-cyan-400/30 flex items-center justify-center text-cyan-300 shrink-0">
                  <Icon name="target" className="w-4 h-4" />
                </div>
                <div>
                  <span className="text-[10px] font-bold uppercase tracking-widest text-cyan-400">Daily Executive Focus</span>
                  <p className="text-xs sm:text-sm font-semibold text-slate-200 mt-0.5">
                    "{companyProfile.dailyFocus}"
                  </p>
                </div>
              </div>
              <button
                onClick={handleCopyForAI}
                className="px-3 py-1.5 rounded-xl bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 border border-indigo-500/40 text-xs font-semibold transition-all shrink-0 flex items-center space-x-1"
              >
                <Icon name="copy" className="w-3.5 h-3.5 text-indigo-300" />
                <span>Copy for AI</span>
              </button>
            </div>

            {/* 3. MY PLATFORMS BAR (Up to 50 Platforms) */}
            <div className="glass-card rounded-2xl p-4 space-y-3">
              <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                <div className="flex items-center space-x-2">
                  <Icon name="globe" className="w-4 h-4 text-purple-400" />
                  <h3 className="font-extrabold text-sm text-slate-200">My Platforms ({platforms.length}/50)</h3>
                </div>
                <button
                  onClick={() => setIsPlatformModalOpen(true)}
                  className="text-xs font-semibold px-2.5 py-1 rounded-lg bg-purple-500/20 hover:bg-purple-500/30 text-purple-300 border border-purple-500/30 transition-all flex items-center space-x-1"
                >
                  <Icon name="plus" className="w-3 h-3" />
                  <span>Add Platform</span>
                </button>
              </div>

              {platforms.length === 0 ? (
                <p className="text-xs text-slate-500 py-2">No platforms registered. Click + Add Platform to connect URLs.</p>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                  {platforms.slice(0, 50).map(plat => (
                    <div key={plat.id} className="p-2.5 rounded-xl bg-space-900/80 border border-slate-800/80 flex items-center justify-between group hover:border-purple-500/40 transition-all">
                      <div className="min-w-0 flex-1 pr-2">
                        <div className="flex items-center space-x-1.5">
                          <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-300">
                            {plat.category || 'General'}
                          </span>
                          <span className="font-extrabold text-xs text-slate-200 truncate">{plat.title}</span>
                        </div>
                        <div className="mt-1">
                          <InlineUrls urls={plat.urls} />
                        </div>
                      </div>
                      <button
                        onClick={() => deleteEntity('platforms', plat.id)}
                        className="p-1 rounded opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 transition-all"
                      >
                        <Icon name="trash" className="w-3.5 h-3.5" />
                      </button>
                    </div>

            {/* 4. DYNAMIC CATEGORY INDEX BAR */}
            <div className="glass-card rounded-2xl p-4 space-y-2">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <Icon name="tag" className="w-4 h-4 text-cyan-400" />
                  <h3 className="font-extrabold text-xs sm:text-sm text-slate-200">Category Index ({categories.length}/30)</h3>
                </div>
                <button
                  onClick={() => setIsCategoryModalOpen(true)}
                  className="text-xs font-semibold text-cyan-400 hover:underline"
                >
                  Manage Categories
                </button>
              </div>

              <div className="flex flex-wrap gap-1.5 pt-1">
                <button
                  onClick={() => setSelectedCategory('All')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                    selectedCategory === 'All'
                      ? 'bg-cyan-500 text-slate-950 font-bold shadow-md'

                    >
                      <span>{cat}</span>
                      <span className={`px-1.5 py-0.2 text-[10px] rounded-full font-bold ${

                      }`}>
                        {count}
                      </span>
                    </button>

                })}
              </div>
            </div>

            {/* 5. MULTI-SELECTION ACTION FLOATING BAR */}
            {selectedItemIds.size > 0 && (
              <div className="sticky top-16 z-40 glass-card rounded-2xl p-3 border border-purple-500/50 bg-purple-950/40 shadow-2xl flex items-center justify-between animate-fade-in">

                  >

                  <button
                    onClick={handleSendSelectedViaEmail}

                  >
                    <Icon name="mail" className="w-3.5 h-3.5" />
                    <span>Send Selected via Email</span>
                  </button>
                </div>
              </div>
            )}

            {/* 6. MAIN PROJECTS DASHBOARD */}
            <div className="glass-card rounded-3xl p-5 sm:p-6 space-y-4">
              
              {/* Header Controls & Filters */}

              ]}
              onClose={() => setIsStudyModalOpen(false)}
              onSave={(data) => {
                saveEntity('studies', data);
                setIsStudyModalOpen(false);
              }}
            />
          )}

          {/* Mindset Modal */}
          {isMindsetModalOpen && (
            <SimpleFormModal
              title="Add Executive Mindset"
              categories={categories}

                { name: 'quote', label: 'Focus Quote / Principle', type: 'textarea', required: true }
              ]}

                setIsMindsetModalOpen(false);
              }}
            />
          )}

            <SimpleFormModal
              title="Add Platform Connection"
              categories={categories}
              fields={[
                { name: 'title', label: 'Platform Name', type: 'text', required: true },
                { name: 'urls', label: 'Multi URLs (comma separated)', type: 'text', placeholder: 'Enter multiple URLs separated by commas', required: true }
              ]}
              onClose={() => setIsPlatformModalOpen(false)}
              onSave={(data) => {
                saveEntity('platforms', data);
                setIsPlatformModalOpen(false);
              }}
            />
          )}

          {/* Category Management Modal */}
          {isCategoryModalOpen && (
            <CategoryManagerModal
              categories={categories}
              onClose={() => setIsCategoryModalOpen(false)}
              onAddCategory={(newCat) => {
                if (categories.length >= 30) {
                  alert('Maximum 30 categories allowed.');
                  return;
                }
                const list = [...categories, newCat];
                setCategories(list);
                localStorage.setItem('ai_ceo_categories', JSON.stringify(list));
              }}
              onDeleteCategory={(catToDelete) => {
                const list = categories.filter(c => c !== catToDelete);
                setCategories(list);
                localStorage.setItem('ai_ceo_categories', JSON.stringify(list));
              }}
            />
          )}

          {/* Company Profile Modal */}
          {isProfileModalOpen && (
            <ProfileModal
              profile={companyProfile}
              onClose={() => setIsProfileModalOpen(false)}
              onSave={(updated) => {
                setCompanyProfile(updated);
                localStorage.setItem('ai_ceo_profile', JSON.stringify(updated));
                setIsProfileModalOpen(false);
              }}
            />
          )}

          {/* Auth Modal */}
          {isAuthModalOpen && (
            <AuthModal
              onClose={() => setIsAuthModalOpen(false)}
              onGoogleLogin={handleGoogleLogin}
              onEmailAuth={handleEmailAuth}
              onOpenConfig={() => {
                setIsAuthModalOpen(false);
                setIsConfigModalOpen(true);
              }}
            />
          )}

          {/* Firebase Config Modal */}
          {isConfigModalOpen && (
            <FirebaseConfigModal
              config={firebaseConfig}
              onClose={() => setIsConfigModalOpen(false)}
              onSave={(cfg) => {
                setFirebaseConfig(cfg);
                localStorage.setItem('ai_ceo_firebase_config', JSON.stringify(cfg));
                setIsConfigModalOpen(false);
                window.location.reload();
              }}
            />
          )}

        </div>
      );
    }

    // Project Form Modal
    function ProjectModalForm({ initialData, categories, distinctCompanies, onClose, onSave }) {

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-300 mb-1">Category Index *</label>
                  <select

                <div>

                    <span>{isStarred ? 'Starred Project' : 'Normal'}</span>

              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">Project Title *</label>

                  placeholder="Executive project title"

            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block font-semibold text-slate-300 mb-1">Category *</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200"
                >
                  {categories.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              {fields.map(field => (
                <div key={field.name}>
                  <label className="block font-semibold text-slate-300 mb-1">{field.label}</label>
                  {field.type === 'textarea' ? (
                    <textarea
                      rows={3}
                      placeholder={field.placeholder || ''}
                      onChange={(e) => setFormData({ ...formData, [field.name]: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200"
                      required={field.required}
                    />
                  ) : (
                    <input
                      type={field.type}
                      placeholder={field.placeholder || ''}
                      onChange={(e) => setFormData({ ...formData, [field.name]: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200"
                      required={field.required}
                    />
                  )}
                </div>
              ))}

              <button
                type="submit"
                className="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold flex items-center justify-center space-x-1 shadow-md transition-all"
              >
                <Icon name="save" className="w-4 h-4" />
                <span>Save Entry</span>
              </button>
            </form>
          </div>
        </div>
      );
    }

    // Category Manager Modal
    function CategoryManagerModal({ categories, onClose, onAddCategory, onDeleteCategory }) {
      const [newCat, setNewCat] = useState('');

      const handleAdd = (e) => {
        e.preventDefault();
        if (newCat.trim()) {
          onAddCategory(newCat.trim());
          setNewCat('');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="bg-space-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-extrabold text-base text-slate-100">Dynamic Category Manager</h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleAdd} className="flex gap-2">
              <input
                type="text"
                placeholder="New Category Name..."
                value={newCat}
                onChange={(e) => setNewCat(e.target.value)}
                className="flex-1 px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-xs text-slate-200"
              />
              <button
                type="submit"
                className="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs shrink-0"
              >
                + Add
              </button>
            </form>

            <div className="max-h-60 overflow-y-auto space-y-1.5 pt-2">
              {categories.map(cat => (
                <div key={cat} className="flex items-center justify-between p-2 rounded-xl bg-space-950 border border-slate-800 text-xs">
                  <span className="font-semibold text-slate-200">{cat}</span>
                  <button
                    onClick={() => onDeleteCategory(cat)}
                    className="p-1 text-slate-500 hover:text-red-400"
                  >
                    <Icon name="trash" className="w-3.5 h-3.5" />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Company Profile Modal
    function ProfileModal({ profile, onClose, onSave }) {
      const [companyName, setCompanyName] = useState(profile.companyName || '');
      const [logoUrl, setLogoUrl] = useState(profile.logoUrl || '');
      const [dailyFocus, setDailyFocus] = useState(profile.dailyFocus || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ companyName, logoUrl, dailyFocus });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="bg-space-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl text-xs">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-extrabold text-base text-slate-100">Company Profile Settings</h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block font-semibold text-slate-300 mb-1">Company Name</label>
                <input
                  type="text"
                  value={companyName}
                  onChange={(e) => setCompanyName(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200"
                  required
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">Company Logo Image URL</label>
                <input
                  type="url"
                  placeholder="https://example.com/logo.png"
                  value={logoUrl}
                  onChange={(e) => setLogoUrl(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">Daily Focus Mindset Motto</label>
                <textarea
                  rows={2}
                  value={dailyFocus}
                  onChange={(e) => setDailyFocus(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200"
                />
              </div>

              <button
                type="submit"
                className="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold transition-all shadow-md"
              >
                Save Profile
              </button>
            </form>
          </div>
        </div>
      );
    }

    // Auth Modal
    function AuthModal({ onClose, onGoogleLogin, onEmailAuth, onOpenConfig }) {
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
          <div className="bg-space-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl text-xs">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-extrabold text-base text-slate-100">Firebase Auth Sign In</h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <button
              onClick={onGoogleLogin}
              className="w-full py-2.5 rounded-xl bg-white hover:bg-slate-100 text-slate-900 font-bold flex items-center justify-center space-x-2 transition-all shadow-md"
            >
              <span>Sign in with Google</span>
            </button>

            <div className="relative text-center my-2">
              <span className="bg-space-900 px-2 text-slate-500 text-[10px]">OR EMAIL LOGIN</span>
            </div>

            <form onSubmit={(e) => onEmailAuth(e, isSignUp, email, password)} className="space-y-3">
              <div>
                <label className="block font-semibold text-slate-300 mb-1">Email</label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200"
                  required
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200"
                  required
                />
              </div>

              <button
                type="submit"
                className="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold shadow-md transition-all"
              >
                {isSignUp ? 'Create Account' : 'Sign In'}
              </button>
            </form>

            <div className="flex items-center justify-between pt-2 border-t border-slate-800 text-[11px]">
              <button onClick={() => setIsSignUp(!isSignUp)} className="text-cyan-400 hover:underline">
                {isSignUp ? 'Already have an account? Sign In' : 'Need an account? Sign Up'}
              </button>
              <button onClick={onOpenConfig} className="text-slate-500 hover:text-slate-300">
                Setup Firebase Config
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Firebase Config Modal
    function FirebaseConfigModal({ config, onClose, onSave }) {
      const [apiKey, setApiKey] = useState(config?.apiKey || '');
      const [authDomain, setAuthDomain] = useState(config?.authDomain || '');
      const [projectId, setProjectId] = useState(config?.projectId || '');
      const [storageBucket, setStorageBucket] = useState(config?.storageBucket || '');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ apiKey, authDomain, projectId, storageBucket });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
          <div className="bg-space-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl text-xs">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-extrabold text-base text-slate-100">Firebase Firestore Config</h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block font-semibold text-slate-300 mb-1">apiKey</label>
                <input
                  type="text"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200 font-mono text-[11px]"
                  required
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">authDomain</label>
                <input
                  type="text"
                  value={authDomain}
                  onChange={(e) => setAuthDomain(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200 font-mono text-[11px]"
                  required
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">projectId</label>
                <input
                  type="text"
                  value={projectId}
                  onChange={(e) => setProjectId(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200 font-mono text-[11px]"
                  required
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-300 mb-1">storageBucket</label>
                <input
                  type="text"
                  value={storageBucket}
                  onChange={(e) => setStorageBucket(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-space-950 border border-slate-800 text-slate-200 font-mono text-[11px]"
                />
              </div>

              <button
                type="submit"
                className="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition-all shadow-md"
              >
                Save Firebase Credentials
              </button>
            </form>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
