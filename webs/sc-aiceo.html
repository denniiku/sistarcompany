<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI-CEO Executive Dashboard</title>

  <!-- Pretendard Font CDN -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appbg: '#f8fafc',
            cardbg: '#ffffff',
            slate: {
              800: '#1e293b',
              700: '#334155',
              600: '#475569',
              400: '#94a3b8',
              200: '#e2e8f0',
              100: '#f1f5f9'
            },
            accent: {
              sky: '#0ea5e9',
              skybg: '#e0f2fe',
              skylight: '#f0f9ff'
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase v9+ Compat SDKs (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #0ea5e9;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="min-h-screen bg-appbg text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Domain Link Parser ---
    const parseDomainLinks = (urlsInput) => {
      if (!urlsInput) return [];
      const list = typeof urlsInput === 'string'
        ? urlsInput.split(',').map(u => u.trim()).filter(Boolean)
        : Array.isArray(urlsInput) ? urlsInput : [];

      return list.map((url, index) => {
        let domain = `Connect ${index + 1}`;
        try {
          const formattedUrl = url.startsWith('http://') || url.startsWith('https://') ? url : `https://${url}`;
          const parsed = new URL(formattedUrl);
          const host = parsed.hostname.replace('www.', '');
          const parts = host.split('.');
          if (parts.length >= 2) {
            domain = parts[0]; // Extract domain name e.g. youtube, github
          } else {
            domain = host;
          }
        } catch (e) {
          domain = `Connect ${index + 1}`;
        }
        const href = url.startsWith('http://') || url.startsWith('https://') ? url : `https://${url}`;
        return { domain, href, original: url };
      });
    };

    // --- Default Initial Data ---
    const DEFAULT_PROJECTS = [
      { id: 'p1', title: 'Executive Workflow Automation', category: 'HQ', details: 'Streamlining quarterly reporting with AI pipeline.', status: 'In Progress', progress: 75, urls: 'https://github.com, https://notion.so' },
      { id: 'p2', title: 'Global Branch Performance Optimization', category: 'Operations', details: 'Analyzing international branch margins.', status: 'In Progress', progress: 50, urls: 'https://google.com' },
      { id: 'p3', title: 'Q3 Capital Allocation Strategy', category: 'Finance', details: 'Budgeting next quarter expansion vectors.', status: 'Completed', progress: 100, urls: 'https://youtube.com' }
    ];

    const DEFAULT_IDEAS = [
      { id: 'i1', title: 'Offline Mobile AI Assistant', details: 'Low-latency local LLM engine for executive travel.', urls: 'https://openai.com, https://github.com' },
      { id: 'i2', title: 'Quantum Encryption B2B SaaS', details: 'Data protection subscription for enterprise clients.', urls: 'https://ibm.com' }
    ];

    const DEFAULT_STUDIES = [
      { id: 's1', title: 'Enterprise RAG Indexing Benchmarks', details: 'Evaluation of hybrid dense retrieval models.', urls: 'https://arxiv.org' }
    ];

    const DEFAULT_MINDSETS = [
      { id: 'm1', title: 'Speed & Radical Execution', details: 'Speed overcomes friction. Maintain extreme clarity and momentum.' },
      { id: 'm2', title: 'Simplicity is Ultimate Sophistication', details: 'Eliminate unnecessary complexity at every level.' }
    ];

    const DEFAULT_PLATFORMS = [
      { id: 'pl1', title: 'AI Studio Build Console', urls: 'https://ai.studio, https://console.cloud.google.com' },
      { id: 'pl2', title: 'GitHub Enterprise Portal', urls: 'https://github.com' }
    ];

    const DEFAULT_PROFILE = {
      companyName: 'SISTAR Group',
      dailyFocus: 'Focus on high-velocity execution and radical operational simplicity.'
    };

    function App() {
      // Firebase User State
      const [user, setUser] = useState(null);
      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        const saved = localStorage.getItem('aiceo_fb_config');
        return saved ? JSON.parse(saved) : null;
      });

      // App Data States
      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('aiceo_projects');
        return saved ? JSON.parse(saved) : DEFAULT_PROJECTS;
      });
      const [ideas, setIdeas] = useState(() => {
        const saved = localStorage.getItem('aiceo_ideas');
        return saved ? JSON.parse(saved) : DEFAULT_IDEAS;
      });
      const [studies, setStudies] = useState(() => {
        const saved = localStorage.getItem('aiceo_studies');
        return saved ? JSON.parse(saved) : DEFAULT_STUDIES;
      });
      const [mindsets, setMindsets] = useState(() => {
        const saved = localStorage.getItem('aiceo_mindsets');
        return saved ? JSON.parse(saved) : DEFAULT_MINDSETS;
      });
      const [platforms, setPlatforms] = useState(() => {
        const saved = localStorage.getItem('aiceo_platforms');
        return saved ? JSON.parse(saved) : DEFAULT_PLATFORMS;
      });
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('aiceo_profile');
        return saved ? JSON.parse(saved) : DEFAULT_PROFILE;
      });

      // Pagination States (10 items max per page)
      const [pageProjects, setPageProjects] = useState(0);
      const [pageIdeas, setPageIdeas] = useState(0);
      const [pageStudies, setPageStudies] = useState(0);
      const [pageMindsets, setPageMindsets] = useState(0);
      const [pagePlatforms, setPagePlatforms] = useState(0);

      // Modal States
      const [activeModalItem, setActiveModalItem] = useState(null); // { type, item, isNew }
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);

      // Initialize Firebase if config exists
      useEffect(() => {
        if (firebaseConfig && firebaseConfig.apiKey) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(firebaseConfig);
            }
            const auth = firebase.auth();
            const unsub = auth.onAuthStateChanged((currUser) => {
              setUser(currUser);
            });
            return () => unsub();
          } catch (e) {
            console.error('Firebase initialization error:', e);
          }
        }
      }, [firebaseConfig]);

      // Firebase Sync when User is authenticated
      useEffect(() => {
        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const userRef = db.collection('users').doc(user.uid);

          const unsubProjects = userRef.collection('projects').onSnapshot((snap) => {
            if (!snap.empty) {
              setProjects(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            }
          });
          const unsubIdeas = userRef.collection('ideas').onSnapshot((snap) => {
            if (!snap.empty) {
              setIdeas(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            }
          });
          const unsubStudies = userRef.collection('studies').onSnapshot((snap) => {
            if (!snap.empty) {
              setStudies(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            }
          });
          const unsubMindsets = userRef.collection('mindsets').onSnapshot((snap) => {
            if (!snap.empty) {
              setMindsets(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            }
          });
          const unsubPlatforms = userRef.collection('platforms').onSnapshot((snap) => {
            if (!snap.empty) {
              setPlatforms(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            }
          });

          return () => {
            unsubProjects();
            unsubIdeas();
            unsubStudies();
            unsubMindsets();
            unsubPlatforms();
          };
        }
      }, [user]);

      // Save Data Handler (Firestore or LocalStorage)
      const saveItem = async (type, itemData) => {
        const id = itemData.id || `${type}_${Date.now()}`;
        const finalItem = { ...itemData, id };

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          await db.collection('users').doc(user.uid).collection(type).doc(id).set(finalItem, { merge: true });
        } else {
          // LocalStorage fallback
          const stateUpdaters = {
            projects: [setProjects, 'aiceo_projects'],
            ideas: [setIdeas, 'aiceo_ideas'],
            studies: [setStudies, 'aiceo_studies'],
            mindsets: [setMindsets, 'aiceo_mindsets'],
            platforms: [setPlatforms, 'aiceo_platforms'],
          };

          if (stateUpdaters[type]) {
            const [setFn, key] = stateUpdaters[type];
            setFn(prev => {
              const exists = prev.some(i => i.id === id);
              const next = exists ? prev.map(i => i.id === id ? finalItem : i) : [finalItem, ...prev];
              localStorage.setItem(key, JSON.stringify(next));
              return next;
            });
          }
        }
        setActiveModalItem(null);
      };

      // Delete Data Handler
      const deleteItem = async (type, id) => {
        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          await db.collection('users').doc(user.uid).collection(type).doc(id).delete();
        } else {
          const stateUpdaters = {
            projects: [setProjects, 'aiceo_projects'],
            ideas: [setIdeas, 'aiceo_ideas'],
            studies: [setStudies, 'aiceo_studies'],
            mindsets: [setMindsets, 'aiceo_mindsets'],
            platforms: [setPlatforms, 'aiceo_platforms'],
          };

          if (stateUpdaters[type]) {
            const [setFn, key] = stateUpdaters[type];
            setFn(prev => {
              const next = prev.filter(i => i.id !== id);
              localStorage.setItem(key, JSON.stringify(next));
              return next;
            });
          }
        }
        setActiveModalItem(null);
      };

      // Save Profile
      const saveProfileData = (newProfile) => {
        setProfile(newProfile);
        localStorage.setItem('aiceo_profile', JSON.stringify(newProfile));
        setIsProfileModalOpen(false);
      };

      // Scroll to Top
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const scrollToSection = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      // Auth Handlers
      const handleGoogleLogin = async () => {
        if (!firebase.apps.length) {
          setIsConfigModalOpen(true);
          return;
        }
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await firebase.auth().signInWithPopup(provider);
          setIsLoginModalOpen(false);
        } catch (e) {
          alert('Login Error: ' + e.message);
        }
      };

      const handleEmailLogin = async (e, email, pass, isNew) => {
        e.preventDefault();
        if (!firebase.apps.length) {
          setIsConfigModalOpen(true);
          return;
        }
        try {
          if (isNew) {
            await firebase.auth().createUserWithEmailAndPassword(email, pass);
          } else {
            await firebase.auth().signInWithEmailAndPassword(email, pass);
          }
          setIsLoginModalOpen(false);
        } catch (e) {
          alert('Auth Error: ' + e.message);
        }
      };

      return (
        <div className="min-h-screen bg-appbg text-slate-800 flex flex-col font-sans">

          {/* STICKY HEADER */}
          <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              {/* Title & Subtitle */}
              <button
                onClick={scrollToTop}
                className="text-left focus:outline-none group cursor-pointer"
                title="Click to Scroll to Top"
              >
                <div className="text-base font-bold text-slate-800 group-hover:text-accent-sky transition-colors">
                  AI-CEO
                </div>
                <div className="text-[11px] text-slate-400 font-normal">
                  Executive Ai Mgnt. System
                </div>
              </button>

              {/* Navigation Menu (Max 1-2 words per menu item) */}
              <nav className="flex items-center space-x-3 text-xs font-medium text-slate-600">
                <button onClick={() => scrollToSection('sec-projects')} className="hover:text-accent-sky transition-colors">Projects</button>
                <button onClick={() => scrollToSection('sec-ideas')} className="hover:text-accent-sky transition-colors">Ideas</button>
                <button onClick={() => scrollToSection('sec-study')} className="hover:text-accent-sky transition-colors">Study</button>
                <button onClick={() => scrollToSection('sec-mindset')} className="hover:text-accent-sky transition-colors">Mindset</button>
                <button onClick={() => scrollToSection('sec-platforms')} className="hover:text-accent-sky transition-colors">Platforms</button>
                <button onClick={() => setIsProfileModalOpen(true)} className="hover:text-accent-sky transition-colors">Profile</button>
                
                {user ? (
                  <button
                    onClick={() => firebase.auth().signOut()}
                    className="px-2.5 py-1 rounded bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors"
                  >
                    Logout
                  </button>
                ) : (
                  <button
                    onClick={() => setIsLoginModalOpen(true)}
                    className="px-2.5 py-1 rounded bg-accent-sky text-white font-medium hover:bg-sky-600 transition-colors"
                  >
                    Login
                  </button>
                )}
              </nav>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-5xl w-full mx-auto px-4 py-6 space-y-8 flex-1">

            {/* DAILY EXECUTIVE FOCUS BANNER */}
            <div className="p-3.5 rounded-lg bg-accent-skylight border border-accent-skybg text-xs text-slate-700 flex items-center justify-between">
              <div>
                <span className="font-semibold text-accent-sky mr-2">• Focus:</span>
                <span>{profile.dailyFocus || 'Execute with speed and extreme clarity.'}</span>
              </div>
              <span className="text-[11px] text-slate-400 font-normal">{profile.companyName}</span>
            </div>

            {/* 1. PROJECTS SECTION */}
            <SectionContainer
              id="sec-projects"
              title="Projects"
              count={projects.length}
              page={pageProjects}
              setPage={setPageProjects}
              onAdd={() => setActiveModalItem({ type: 'projects', item: { title: '', category: 'HQ', details: '', status: 'In Progress', progress: 0, urls: '' }, isNew: true })}
            >
              {projects.slice(pageProjects * 10, (pageProjects + 1) * 10).map((proj) => (
                <ListItemRow
                  key={proj.id}
                  title={proj.title}
                  category={proj.category}
                  badge={proj.status}
                  urls={proj.urls}
                  onClick={() => setActiveModalItem({ type: 'projects', item: proj, isNew: false })}
                />
              ))}
            </SectionContainer>

            {/* 2. IDEAS SECTION */}
            <SectionContainer
              id="sec-ideas"
              title="Ideas"
              count={ideas.length}
              page={pageIdeas}
              setPage={setPageIdeas}
              onAdd={() => setActiveModalItem({ type: 'ideas', item: { title: '', details: '', urls: '' }, isNew: true })}
            >
              {ideas.slice(pageIdeas * 10, (pageIdeas + 1) * 10).map((idea) => (
                <ListItemRow
                  key={idea.id}
                  title={idea.title}
                  urls={idea.urls}
                  onClick={() => setActiveModalItem({ type: 'ideas', item: idea, isNew: false })}
                />
              ))}
            </SectionContainer>

            {/* 3. STUDY SECTION */}
            <SectionContainer
              id="sec-study"
              title="Study"
              count={studies.length}
              page={pageStudies}
              setPage={setPageStudies}
              onAdd={() => setActiveModalItem({ type: 'studies', item: { title: '', details: '', urls: '' }, isNew: true })}
            >
              {studies.slice(pageStudies * 10, (pageStudies + 1) * 10).map((std) => (
                <ListItemRow
                  key={std.id}
                  title={std.title}
                  urls={std.urls}
                  onClick={() => setActiveModalItem({ type: 'studies', item: std, isNew: false })}
                />
              ))}
            </SectionContainer>

            {/* 4. MINDSET SECTION */}
            <SectionContainer
              id="sec-mindset"
              title="Mindset"
              count={mindsets.length}
              page={pageMindsets}
              setPage={setPageMindsets}
              onAdd={() => setActiveModalItem({ type: 'mindsets', item: { title: '', details: '' }, isNew: true })}
            >
              {mindsets.slice(pageMindsets * 10, (pageMindsets + 1) * 10).map((mind) => (
                <ListItemRow
                  key={mind.id}
                  title={mind.title}
                  onClick={() => setActiveModalItem({ type: 'mindsets', item: mind, isNew: false })}
                />
              ))}
            </SectionContainer>

            {/* 5. PLATFORMS SECTION */}
            <SectionContainer
              id="sec-platforms"
              title="Platforms"
              count={platforms.length}
              page={pagePlatforms}
              setPage={setPagePlatforms}
              onAdd={() => setActiveModalItem({ type: 'platforms', item: { title: '', urls: '' }, isNew: true })}
            >
              {platforms.slice(pagePlatforms * 10, (pagePlatforms + 1) * 10).map((plat) => (
                <ListItemRow
                  key={plat.id}
                  title={plat.title}
                  urls={plat.urls}
                  onClick={() => setActiveModalItem({ type: 'platforms', item: plat, isNew: false })}
                />
              ))}
            </SectionContainer>

          </main>

          {/* ITEM DETAIL & EDIT MODAL */}
          {activeModalItem && (
            <ItemModal
              modalData={activeModalItem}
              onClose={() => setActiveModalItem(null)}
              onSave={saveItem}
              onDelete={deleteItem}
            />
          )}

          {/* PROFILE MODAL */}
          {isProfileModalOpen && (
            <ProfileModal
              profile={profile}
              onClose={() => setIsProfileModalOpen(false)}
              onSave={saveProfileData}
              user={user}
              onOpenConfig={() => setIsConfigModalOpen(true)}
            />
          )}

          {/* LOGIN MODAL */}
          {isLoginModalOpen && (
            <LoginModal
              onClose={() => setIsLoginModalOpen(false)}
              onGoogleLogin={handleGoogleLogin}
              onEmailLogin={handleEmailLogin}
              onOpenConfig={() => setIsConfigModalOpen(true)}
            />
          )}

          {/* FIREBASE CONFIG MODAL */}
          {isConfigModalOpen && (
            <ConfigModal
              currentConfig={firebaseConfig}
              onClose={() => setIsConfigModalOpen(false)}
              onSave={(cfg) => {
                setFirebaseConfig(cfg);
                localStorage.setItem('aiceo_fb_config', JSON.stringify(cfg));
                setIsConfigModalOpen(false);
                alert('Firebase Config saved. Reloading...');
                window.location.reload();
              }}
            />
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-400">
            AI-CEO Executive Management System • Single-File Clean Architecture
          </footer>
        </div>
      );
    }

    // --- REUSABLE COMPONENTS ---

    // Section Container with Pagination (10 max per page)
    function SectionContainer({ id, title, count, page, setPage, onAdd, children }) {
      const maxPages = Math.ceil(count / 10);

      return (
        <section id={id} className="bg-cardbg rounded-xl border border-slate-200 p-4 space-y-3">
          <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
            <div className="flex items-center space-x-2">
              <span className="font-semibold text-sm text-slate-800">{title}</span>
              <span className="text-xs font-medium text-slate-400">({count})</span>
            </div>

            <button
              onClick={onAdd}
              className="px-2.5 py-1 text-xs font-medium rounded bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors"
            >
              + Add
            </button>
          </div>

          <div className="divide-y divide-slate-100">
            {count === 0 ? (
              <div className="py-4 text-xs text-slate-400 text-center">No items recorded.</div>
            ) : (
              children
            )}
          </div>

          {/* Pagination Controls */}
          {maxPages > 1 && (
            <div className="flex items-center justify-between pt-2 text-xs text-slate-500">
              <span>Page {page + 1} of {maxPages}</span>
              <div className="space-x-1">
                <button
                  disabled={page === 0}
                  onClick={() => setPage(p => Math.max(0, p - 1))}
                  className="px-2 py-0.5 rounded border border-slate-200 disabled:opacity-40 hover:bg-slate-50"
                >
                  [Prev 10]
                </button>
                <button
                  disabled={page >= maxPages - 1}
                  onClick={() => setPage(p => Math.min(maxPages - 1, p + 1))}
                  className="px-2 py-0.5 rounded border border-slate-200 disabled:opacity-40 hover:bg-slate-50"
                >
                  [Next 10]
                </button>
              </div>
            </div>
          )}
        </section>
      );
    }

    // Single-Line List Item Row
    function ListItemRow({ title, category, badge, urls, onClick }) {
      const domainLinks = parseDomainLinks(urls);

      return (
        <div
          onClick={onClick}
          className="py-2.5 px-2 hover:bg-accent-skylight cursor-pointer transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-xs"
        >
          <div className="flex items-center space-x-2 truncate">
            <span className="text-slate-400 font-bold">•</span>
            {category && (
              <span className="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-medium">
                {category}
              </span>
            )}
            <span className="font-medium text-slate-800 truncate">{title}</span>
            {badge && (
              <span className="px-1.5 py-0.5 rounded bg-accent-skybg text-accent-sky text-[10px] font-medium shrink-0">
                {badge}
              </span>
            )}
          </div>

          {/* Inline Domain Links */}
          {domainLinks.length > 0 && (
            <div className="flex flex-wrap items-center space-x-1.5 text-[11px] text-slate-500 shrink-0" onClick={(e) => e.stopPropagation()}>
              {domainLinks.map((link, i) => (
                <span key={i} className="inline-flex items-center">
                  <span className="text-slate-400 mr-0.5">▫️</span>
                  <a
                    href={link.href}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-accent-sky hover:underline"
                  >
                    {link.domain}
                  </a>
                  {i < domainLinks.length - 1 && <span className="text-slate-300 ml-1">,</span>}
                </span>
              ))}
            </div>
          )}
        </div>
      );
    }

    // Modal for Creating & Editing Items
    function ItemModal({ modalData, onClose, onSave, onDelete }) {
      const { type, item, isNew } = modalData;
      const [formData, setFormData] = useState({ ...item });

      const handleChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(type, formData);
      };

      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
          <div className="bg-white rounded-xl border border-slate-200 shadow-xl max-w-lg w-full p-5 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2">
              <span className="font-bold text-sm text-slate-800">
                {isNew ? `New ${type.slice(0, -1)}` : `Edit ${type.slice(0, -1)}`}
              </span>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-600 font-medium mb-1">Title</label>
                <input
                  type="text"
                  required
                  value={formData.title || ''}
                  onChange={(e) => handleChange('title', e.target.value)}
                  className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky"
                  placeholder="Enter title"
                />
              </div>

              {type === 'projects' && (
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-600 font-medium mb-1">Category</label>
                    <input
                      type="text"
                      value={formData.category || ''}
                      onChange={(e) => handleChange('category', e.target.value)}
                      className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky"
                      placeholder="e.g. HQ, Finance"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-600 font-medium mb-1">Status</label>
                    <select
                      value={formData.status || 'In Progress'}
                      onChange={(e) => handleChange('status', e.target.value)}
                      className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky bg-white"
                    >
                      <option value="In Progress">In Progress</option>
                      <option value="Completed">Completed</option>
                      <option value="Planning">Planning</option>
                    </select>
                  </div>
                </div>
              )}

              <div>
                <label className="block text-slate-600 font-medium mb-1">Details / Note</label>
                <textarea
                  rows="3"
                  value={formData.details || ''}
                  onChange={(e) => handleChange('details', e.target.value)}
                  className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky"
                  placeholder="Enter detailed description"
                />
              </div>

              {type !== 'mindsets' && (
                <div>
                  <label className="block text-slate-600 font-medium mb-1">Multi URLs</label>
                  <input
                    type="text"
                    value={formData.urls || ''}
                    onChange={(e) => handleChange('urls', e.target.value)}
                    className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky font-mono text-[11px]"
                    placeholder="Enter multiple URLs separated by commas"
                  />
                  <span className="text-[10px] text-slate-400 mt-0.5 block">Separated by commas e.g. https://youtube.com, https://github.com</span>
                </div>
              )}

              <div className="flex items-center justify-between pt-3 border-t border-slate-100">
                {!isNew ? (
                  <button
                    type="button"
                    onClick={() => onDelete(type, formData.id)}
                    className="px-3 py-1.5 rounded bg-red-50 text-red-600 hover:bg-red-100 font-medium transition-colors"
                  >
                    Delete
                  </button>
                ) : <div />}

                <div className="space-x-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-3 py-1.5 rounded bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-1.5 rounded bg-accent-sky text-white font-medium hover:bg-sky-600 transition-colors"
                  >
                    Save
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Profile Settings Modal
    function ProfileModal({ profile, onClose, onSave, user, onOpenConfig }) {
      const [formData, setFormData] = useState({ ...profile });

      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
          <div className="bg-white rounded-xl border border-slate-200 shadow-xl max-w-md w-full p-5 space-y-4 text-xs">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2">
              <span className="font-bold text-sm text-slate-800">Profile & Settings</span>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>

            <div className="space-y-3">
              <div>
                <label className="block text-slate-600 font-medium mb-1">Company / Organization Name</label>
                <input
                  type="text"
                  value={formData.companyName || ''}
                  onChange={(e) => setFormData(p => ({ ...p, companyName: e.target.value }))}
                  className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky"
                />
              </div>

              <div>
                <label className="block text-slate-600 font-medium mb-1">Daily Executive Focus</label>
                <input
                  type="text"
                  value={formData.dailyFocus || ''}
                  onChange={(e) => setFormData(p => ({ ...p, dailyFocus: e.target.value }))}
                  className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky"
                />
              </div>

              <div className="p-3 bg-slate-50 rounded border border-slate-200 space-y-1">
                <div className="font-medium text-slate-700">Account Status</div>
                <div className="text-slate-500">
                  {user ? `Logged in as: ${user.email}` : 'Not logged in (Using LocalStorage)'}
                </div>
                <button
                  type="button"
                  onClick={onOpenConfig}
                  className="text-accent-sky hover:underline mt-1 block font-medium"
                >
                  Configure Firebase Credentials
                </button>
              </div>
            </div>

            <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
              <button onClick={onClose} className="px-3 py-1.5 rounded bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium">Cancel</button>
              <button onClick={() => onSave(formData)} className="px-4 py-1.5 rounded bg-accent-sky text-white font-medium hover:bg-sky-600">Save Profile</button>
            </div>
          </div>
        </div>
      );
    }

    // Login Modal
    function LoginModal({ onClose, onGoogleLogin, onEmailLogin, onOpenConfig }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
          <div className="bg-white rounded-xl border border-slate-200 shadow-xl max-w-sm w-full p-5 space-y-4 text-xs">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2">
              <span className="font-bold text-sm text-slate-800">Login to AI-CEO</span>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>

            <button
              onClick={onGoogleLogin}
              className="w-full py-2 px-3 rounded border border-slate-200 hover:bg-slate-50 font-medium text-slate-700 flex items-center justify-center space-x-2 transition-colors"
            >
              <span>Login with Google</span>
            </button>

            <div className="text-center text-slate-400 text-[10px] uppercase font-semibold">or email login</div>

            <form onSubmit={(e) => onEmailLogin(e, email, password, false)} className="space-y-2">
              <input
                type="email"
                required
                placeholder="Email address"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky"
              />
              <input
                type="password"
                required
                placeholder="Password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                className="w-full px-3 py-1.5 rounded border border-slate-200 focus:outline-none focus:border-accent-sky"
              />
              <div className="flex space-x-2 pt-1">
                <button
                  type="submit"
                  className="flex-1 py-1.5 rounded bg-accent-sky text-white font-medium hover:bg-sky-600 transition-colors"
                >
                  Sign In
                </button>
                <button
                  type="button"
                  onClick={(e) => onEmailLogin(e, email, password, true)}
                  className="flex-1 py-1.5 rounded bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition-colors"
                >
                  Sign Up
                </button>
              </div>
            </form>

            <div className="text-center pt-2 border-t border-slate-100">
              <button onClick={onOpenConfig} className="text-[11px] text-accent-sky hover:underline">Set Firebase Credentials</button>
            </div>
          </div>
        </div>
      );
    }

    // Config Modal
    function ConfigModal({ currentConfig, onClose, onSave }) {
      const [apiKey, setApiKey] = useState(currentConfig?.apiKey || '');
      const [authDomain, setAuthDomain] = useState(currentConfig?.authDomain || '');
      const [projectId, setProjectId] = useState(currentConfig?.projectId || '');

      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
          <div className="bg-white rounded-xl border border-slate-200 shadow-xl max-w-md w-full p-5 space-y-4 text-xs">
            <div className="flex items-center justify-between border-b border-slate-100 pb-2">
              <span className="font-bold text-sm text-slate-800">Firebase Config</span>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>

            <div className="space-y-2">
              <div>
                <label className="block text-slate-600 font-medium mb-1">API Key</label>
                <input
                  type="text"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  className="w-full px-3 py-1.5 rounded border border-slate-200 font-mono text-[11px]"
                />
              </div>
              <div>
                <label className="block text-slate-600 font-medium mb-1">Auth Domain</label>
                <input
                  type="text"
                  value={authDomain}
                  onChange={(e) => setAuthDomain(e.target.value)}
                  className="w-full px-3 py-1.5 rounded border border-slate-200 font-mono text-[11px]"
                />
              </div>
              <div>
                <label className="block text-slate-600 font-medium mb-1">Project ID</label>
                <input
                  type="text"
                  value={projectId}
                  onChange={(e) => setProjectId(e.target.value)}
                  className="w-full px-3 py-1.5 rounded border border-slate-200 font-mono text-[11px]"
                />
              </div>
            </div>

            <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
              <button onClick={onClose} className="px-3 py-1.5 rounded bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium">Cancel</button>
              <button
                onClick={() => onSave({ apiKey, authDomain, projectId })}
                className="px-4 py-1.5 rounded bg-accent-sky text-white font-medium hover:bg-sky-600"
              >
                Save Config
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
