    // Emoji options for projects
    const EMOJI_LIST = ['🚀', '💼', '⚡', '💎', '📈', '🤖', '🌐', '🎯', '🔮', '🏆', '💡', '🛡️'];

    const DEFAULT_PROFILE = {

    // --- Inline Multi URL Renderer ---
    const InlineUrls = ({ urls }) => {
      if (!urls) return null;
      const list = typeof urls === 'string' 
        ? urls.split(',').map(u => u.trim()).filter(Boolean)
        : Array.isArray(urls) ? urls : [];

      if (list.length === 0) return null;

      return (
        <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-amber-400 font-mono">
          {list.map((url, idx) => {
            let label = `Link ${idx + 1}`;
            try {
              const parsed = new URL(url.startsWith('http') ? url : `https://${url}`);
              label = parsed.hostname.replace('www.', '');
            } catch (e) {}

            const href = url.startsWith('http') ? url : `https://${url}`;

            return (
              <span key={idx} className="inline-flex items-center space-x-1">
                <span className="text-stone-500 font-sans text-[11px]">▫️</span>
                <a
                  href={href}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="hover:underline hover:text-amber-300 font-medium inline-flex items-center space-x-1"
                >
                  <span>{label}</span>
                  <Icon name="externalLink" className="w-2.5 h-2.5 opacity-70" />
                </a>
                {idx < list.length - 1 && <span className="text-stone-600">,</span>}
              </span>
            );
          })}
        </div>
      );
    };

    // --- MAIN REACT APP ---
    function App() {
      // Firebase State
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authEmail, setAuthEmail] = useState('');
      const [authPass, setAuthPass] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);

      // App Data States
      const [companyProfile, setCompanyProfile] = useState(DEFAULT_PROFILE);
      const [projectCategories, setProjectCategories] = useState(DEFAULT_PROJECT_CATEGORIES);
      const [ideaCategories, setIdeaCategories] = useState(DEFAULT_IDEA_CATEGORIES);
      const [projects, setProjects] = useState(DEFAULT_PROJECTS);
      const [ideas, setIdeas] = useState(DEFAULT_IDEAS);
      const [studies, setStudies] = useState(DEFAULT_STUDIES);
      const [mindsets, setMindsets] = useState(DEFAULT_MINDSETS);
      const [platforms, setPlatforms] = useState(DEFAULT_PLATFORMS);

      // Multi Selection State for Emailing
      const [selectedItemIds, setSelectedItemIds] = useState(new Set());

      // Filter & Sorting
      const [globalSearch, setGlobalSearch] = useState('');
      const [searchTab, setSearchTab] = useState('All'); // 'All', 'Projects', 'Ideas', 'Study'
      const [selectedProjectCategory, setSelectedProjectCategory] = useState('All');
      const [selectedIdeaCategory, setSelectedIdeaCategory] = useState('All');
      const [onlyStarredProjects, setOnlyStarredProjects] = useState(false);
      const [sortByProgress, setSortByProgress] = useState(false); // false: default, true: progress desc

      // Modals
      const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
      const [editingProject, setEditingProject] = useState(null);

      const [isIdeaModalOpen, setIsIdeaModalOpen] = useState(false);
      const [editingIdea, setEditingIdea] = useState(null);

      const [isStudyModalOpen, setIsStudyModalOpen] = useState(false);
      const [isMindsetModalOpen, setIsMindsetModalOpen] = useState(false);
      const [isPlatformModalOpen, setIsPlatformModalOpen] = useState(false);
      const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
      const [categoryModalType, setCategoryModalType] = useState('Project'); // 'Project' or 'Idea'
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);

      // Daily Executive Focus (randomly selected from Mindsets)
      const dailyFocus = useMemo(() => {
        if (mindsets.length === 0) return "Master executive velocity with radical focus.";
        const randIndex = Math.floor(Math.abs(new Date().getDate()) % mindsets.length);
        return mindsets[randIndex]?.quote || mindsets[0].quote;
      }, [mindsets]);

      // Load Local Storage Fallback
      useEffect(() => {
        const lp = localStorage.getItem('ai_ceo_projects_v3');
        if (lp) setProjects(JSON.parse(lp));
        const li = localStorage.getItem('ai_ceo_ideas_v3');
        if (li) setIdeas(JSON.parse(li));
        const ls = localStorage.getItem('ai_ceo_studies_v3');
        if (ls) setStudies(JSON.parse(ls));
        const lm = localStorage.getItem('ai_ceo_mindsets_v3');
        if (lm) setMindsets(JSON.parse(lm));
        const lplat = localStorage.getItem('ai_ceo_platforms_v3');
        if (lplat) setPlatforms(JSON.parse(lplat));
        const lpc = localStorage.getItem('ai_ceo_proj_cat_v3');
        if (lpc) setProjectCategories(JSON.parse(lpc));
        const lic = localStorage.getItem('ai_ceo_idea_cat_v3');
        if (lic) setIdeaCategories(JSON.parse(lic));
        const lprof = localStorage.getItem('ai_ceo_profile_v3');
        if (lprof) setCompanyProfile(JSON.parse(lprof));

        // Listen to Firebase Auth if initialized
        if (window.firebase && firebase.apps.length) {
          const auth = firebase.auth();
          const unsub = auth.onAuthStateChanged(u => {
            setUser(u);
            setAuthLoading(false);
          });
          return () => unsub();
        } else {
          setAuthLoading(false);
        }
      }, []);

      // Scroll to top handler
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const scrollToSection = (id) => {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      // Save Entity helper
      const saveEntity = (type, item) => {
        const today = new Date().toISOString().split('T')[0];
        const newItem = { ...item, updatedAt: today };

        if (type === 'projects') {
          const id = newItem.id || `proj-${Date.now()}`;
          const finalItem = { ...newItem, id };
          setProjects(prev => {
            const list = prev.some(p => p.id === id) ? prev.map(p => p.id === id ? finalItem : p) : [finalItem, ...prev];
            localStorage.setItem('ai_ceo_projects_v3', JSON.stringify(list));
            return list;
          });
        } else if (type === 'ideas') {
          const id = newItem.id || `idea-${Date.now()}`;
          const finalItem = { ...newItem, id };
          setIdeas(prev => {
            const list = prev.some(i => i.id === id) ? prev.map(i => i.id === id ? finalItem : i) : [finalItem, ...prev];
            localStorage.setItem('ai_ceo_ideas_v3', JSON.stringify(list));
            return list;
          });
        } else if (type === 'studies') {
          const id = newItem.id || `study-${Date.now()}`;
          const finalItem = { ...newItem, id };
          setStudies(prev => {
            const list = [finalItem, ...prev.filter(s => s.id !== id)];
            localStorage.setItem('ai_ceo_studies_v3', JSON.stringify(list));
            return list;
          });
        } else if (type === 'mindsets') {
          const id = newItem.id || `mindset-${Date.now()}`;
          const finalItem = { ...newItem, id };
          setMindsets(prev => {
            const list = [finalItem, ...prev.filter(m => m.id !== id)];
            localStorage.setItem('ai_ceo_mindsets_v3', JSON.stringify(list));
            return list;
          });
        } else if (type === 'platforms') {
          const id = newItem.id || `plat-${Date.now()}`;
          const finalItem = { ...newItem, id };
          setPlatforms(prev => {
            const list = [finalItem, ...prev.filter(p => p.id !== id)];
            localStorage.setItem('ai_ceo_platforms_v3', JSON.stringify(list));
            return list;
          });
        }
      };

      // Delete Entity
      const deleteEntity = (type, id) => {
        if (type === 'projects') {
          setProjects(prev => {
            const list = prev.filter(p => p.id !== id);
            localStorage.setItem('ai_ceo_projects_v3', JSON.stringify(list));
            return list;
          });
        } else if (type === 'ideas') {
          setIdeas(prev => {
            const list = prev.filter(i => i.id !== id);
            localStorage.setItem('ai_ceo_ideas_v3', JSON.stringify(list));
            return list;

          setStudies(prev => {
            const list = prev.filter(s => s.id !== id);

            return list;
          });
        } else if (type === 'mindsets') {
          setMindsets(prev => {
            const list = prev.filter(m => m.id !== id);
            localStorage.setItem('ai_ceo_mindsets_v3', JSON.stringify(list));
            return list;
          });
        } else if (type === 'platforms') {
          setPlatforms(prev => {
            const list = prev.filter(p => p.id !== id);
            localStorage.setItem('ai_ceo_platforms_v3', JSON.stringify(list));
            return list;
          });
        }
      };

      // Selection Checkboxes
      const toggleItemSelection = (id) => {
        setSelectedItemIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      // Send Selected via Email
      const handleSendSelectedViaEmail = () => {
        if (selectedItemIds.size === 0) return;

        const allItems = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = allItems.filter(item => selectedItemIds.has(item.id));

        let bodyText = `Executive Report - ${companyProfile.companyName}\nDate: ${new Date().toLocaleDateString()}\n\n`;
        selectedList.forEach((item, index) => {
          bodyText += `${index + 1}. ${item.title || item.quote || 'Untitled'}\n`;
          if (item.company) bodyText += `   Company: ${item.company}\n`;
          if (item.category) bodyText += `   Category: ${item.category}\n`;
          if (item.status) bodyText += `   Status: ${item.status} (${item.progress}%)\n`;
          if (item.objective) bodyText += `   Objective: ${item.objective}\n`;
          if (item.urls) bodyText += `   URLs: ${item.urls}\n`;
          bodyText += `\n`;
        });

        const mailtoUrl = `mailto:?subject=${encodeURIComponent(`[AI-CEO Report] ${companyProfile.companyName} Updates`)}&body=${encodeURIComponent(bodyText)}`;
        window.location.href = mailtoUrl;
      };

      // CSV Data Export
      const handleExportCSV = () => {
        let csv = "Type,Title/Quote,Category,Company/Details,Status/Progress,Objective/Prompt,URLs,Date\n";

        projects.forEach(p => {
          csv += `"Project","${(p.title||'').replace(/"/g, '""')}","${p.category||''}","${p.company||''}","${p.status} (${p.progress}%)","${(p.objective||'').replace(/"/g, '""')}","${p.urls||''}","${p.updatedAt||''}"\n`;
        });
        ideas.forEach(i => {
          csv += `"Idea","${(i.title||'').replace(/"/g, '""')}","${i.category||''}","${(i.content||'').replace(/"/g, '""')}","Stars: ${i.stars||0}","N/A","${i.urls||''}","${i.createdAt||''}"\n`;
        });
        studies.forEach(s => {
          csv += `"Study","${(s.title||'').replace(/"/g, '""')}","RnD","${(s.summary||'').replace(/"/g, '""')}","N/A","N/A","${s.urls||''}","${s.createdAt||''}"\n`;
        });
        mindsets.forEach(m => {
          csv += `"Mindset","${(m.quote||'').replace(/"/g, '""')}","Executive","N/A","N/A","N/A","N/A","${m.createdAt||''}"\n`;
        });

        const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csv);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `AI_CEO_Executive_Export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Copy Markdown Context for AI
      const handleCopyForAI = (item) => {
        let md = '';
        if (item) {
          md = `### [${item.category || 'Executive'}] ${item.title}\n`;
          if (item.company) md += `**Company**: ${item.company}\n`;
          if (item.objective) md += `**Objective**: ${item.objective}\n`;
          if (item.aiPrompt) md += `**AI Prompt Vector**: ${item.aiPrompt}\n`;
          if (item.content || item.summary) md += `**Content**: ${item.content || item.summary}\n`;
          if (item.urls) md += `**URLs**: ${item.urls}\n`;
        } else {
          md = `# AI-CEO Executive Memory & Context\nCompany: ${companyProfile.companyName}\n\n`;
          md += `## Daily Mindset\n> ${dailyFocus}\n\n`;
          md += `## Projects (${projects.length})\n`;
          projects.forEach(p => {
            md += `- **[${p.category}] ${p.title}** (${p.company}) | Progress: ${p.progress}%\n  Objective: ${p.objective || 'N/A'}\n  Prompt Vector: ${p.aiPrompt || 'N/A'}\n  URLs: ${p.urls || 'None'}\n`;
          });
        }

        navigator.clipboard.writeText(md);
        alert('Copied Markdown prompt context for AI to clipboard!');
      };

      // Filtered Projects
      const filteredProjects = useMemo(() => {
        let list = projects.filter(p => {
          const matchCat = selectedProjectCategory === 'All' || p.category === selectedProjectCategory;
          const matchStar = !onlyStarredProjects || p.isStarred;
          const matchQuery = !globalSearch.trim() || 
            p.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            p.company.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (p.objective && p.objective.toLowerCase().includes(globalSearch.toLowerCase()));
          return matchCat && matchStar && matchQuery;
        });

        if (sortByProgress) {
          list = [...list].sort((a, b) => b.progress - a.progress);
        }
        return list;
      }, [projects, selectedProjectCategory, onlyStarredProjects, globalSearch, sortByProgress]);

      // Filtered Ideas
      const filteredIdeas = useMemo(() => {
        return ideas.filter(i => {
          const matchCat = selectedIdeaCategory === 'All' || i.category === selectedIdeaCategory;
          const matchQuery = !globalSearch.trim() || 
            i.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            i.content.toLowerCase().includes(globalSearch.toLowerCase());
          return matchCat && matchQuery;
        });
      }, [ideas, selectedIdeaCategory, globalSearch]);

      // Filtered Studies
      const filteredStudies = useMemo(() => {
        return studies.filter(s => {
          return !globalSearch.trim() || 
            s.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (s.summary && s.summary.toLowerCase().includes(globalSearch.toLowerCase()));
        });
      }, [studies, globalSearch]);

      // Metrics
      const totalProjects = projects.length;
      const inProgressProjects = projects.filter(p => p.status === 'In Progress').length;
      const starredIdeasCount = ideas.filter(i => i.stars >= 1).length;
      const totalStudies = studies.length;
      const activePlatforms = platforms.length;

      return (
        <div className="min-h-screen bg-stone-950 text-amber-100 flex flex-col font-sans pb-24">
          
          {/* 1. STICKY TOP NAVIGATION BAR */}
          <header className="sticky top-0 z-50 executive-nav">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              
              {/* Left Title & Briefcase Icon (Click to Scroll to Top) */}
              <button
                onClick={scrollToTop}
                className="flex items-center space-x-3 text-left group cursor-pointer focus:outline-none"
                title="Scroll to Top"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-600 via-amber-700 to-amber-900 border border-amber-500/40 flex items-center justify-center text-amber-200 shadow-lg group-hover:scale-105 transition-transform">
                  <Icon name="briefcase" className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="font-serif font-bold text-xl tracking-wide text-amber-200 group-hover:text-amber-100 transition-colors">
                    AI-CEO
                  </h1>
                  <p className="text-[11px] text-stone-400 font-medium tracking-tight">
                    Executive Ai Mgnt. System
                  </p>
                </div>
              </button>

              {/* Right Action Menu */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => { setEditingProject(null); setIsProjectModalOpen(true); }}
                  className="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs transition-all shadow-md flex items-center space-x-1"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>+ Project</span>
                </button>

                <button
                  onClick={() => { setEditingIdea(null); setIsIdeaModalOpen(true); }}
                  className="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-amber-200 border border-amber-900/40 text-xs font-semibold transition-all hidden sm:flex items-center space-x-1"
                >
                  <Icon name="lightbulb" className="w-3.5 h-3.5 text-amber-400" />
                  <span>+ Idea</span>
                </button>

                <button
                  onClick={() => scrollToSection('study-section')}
                  className="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 border border-stone-700 text-xs font-semibold transition-all hidden md:flex items-center space-x-1"
                >
                  <Icon name="bookOpen" className="w-3.5 h-3.5 text-stone-400" />
                  <span>Study</span>
                </button>

                <button
                  onClick={() => scrollToSection('mindset-section')}
                  className="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 border border-stone-700 text-xs font-semibold transition-all hidden md:flex items-center space-x-1"
                >
                  <Icon name="target" className="w-3.5 h-3.5 text-amber-500" />
                  <span>Mindset</span>
                </button>

                <button
                  onClick={() => scrollToSection('platforms-section')}
                  className="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 border border-stone-700 text-xs font-semibold transition-all hidden lg:flex items-center space-x-1"
                >
                  <Icon name="globe" className="w-3.5 h-3.5 text-amber-400" />
                  <span>Platforms</span>
                </button>

                <button

                  className="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 border border-stone-700 text-xs font-semibold transition-all flex items-center space-x-1"
                  title="Profile Settings"
                >
                  <Icon name="user" className="w-3.5 h-3.5 text-amber-400" />
                  <span className="hidden sm:inline">Profile</span>
                </button>

                <button
                  onClick={handleExportCSV}
                  className="px-2.5 py-1.5 rounded-xl bg-amber-950/60 hover:bg-amber-900/60 text-amber-300 border border-amber-800/50 text-xs font-semibold transition-all flex items-center space-x-1"
                  title="Export All Data as CSV"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                </button>

                {user ? (
                  <button
                    onClick={() => firebase.auth().signOut()}
                    className="p-1.5 rounded-xl bg-stone-800 hover:bg-red-950/50 text-stone-400 hover:text-red-400 border border-stone-700 text-xs transition-all"
                    title="Log Out"
                  >
                    <Icon name="logOut" className="w-4 h-4" />
                  </button>
                ) : (
                  <button
                    onClick={() => setIsAuthModalOpen(true)}
                    className="px-3 py-1.5 rounded-xl bg-amber-700 hover:bg-amber-600 text-stone-950 font-bold text-xs transition-all shadow-md"
                  >
                    LogIn
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* 2. DAILY EXECUTIVE FOCUS BANNER */}
          <div className="bg-gradient-to-r from-stone-900 via-amber-950/40 to-stone-900 border-b border-amber-900/30 px-4 py-3 text-center">
            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-center space-y-1 sm:space-y-0 sm:space-x-3">
              <span className="text-amber-500 font-bold text-xs uppercase tracking-widest flex items-center space-x-1 shrink-0">
                <Icon name="sparkles" className="w-3.5 h-3.5" />
                <span>Daily Executive Focus:</span>
              </span>
              <p className="font-serif italic text-amber-200 text-sm sm:text-base font-medium">
                "{dailyFocus}"
              </p>
            </div>
          </div>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-7xl w-full mx-auto px-4 py-6 space-y-8">

            {/* 3. RESTORED SLIM STATUS DASHBOARD METRIC BAR */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
              <button
                onClick={() => scrollToSection('projects-section')}
                className="executive-card executive-card-hover p-3.5 rounded-2xl text-left border border-amber-900/30 group"
              >
                <div className="flex items-center justify-between text-stone-400 text-xs font-semibold mb-1">
                  <span>Total Projects</span>
                  <Icon name="folder" className="w-4 h-4 text-amber-500 group-hover:scale-110 transition-transform" />
                </div>
                <div className="text-2xl font-serif font-bold text-amber-100">{totalProjects}</div>
              </button>

              <button
                onClick={() => scrollToSection('projects-section')}
                className="executive-card executive-card-hover p-3.5 rounded-2xl text-left border border-amber-900/30 group"
              >
                <div className="flex items-center justify-between text-stone-400 text-xs font-semibold mb-1">
                  <span>In Progress</span>
                  <Icon name="sparkles" className="w-4 h-4 text-amber-400 group-hover:scale-110 transition-transform" />
                </div>
                <div className="text-2xl font-serif font-bold text-amber-300">{inProgressProjects}</div>
              </button>

              <button
                onClick={() => scrollToSection('ideas-section')}
                className="executive-card executive-card-hover p-3.5 rounded-2xl text-left border border-amber-900/30 group"
              >
                <div className="flex items-center justify-between text-stone-400 text-xs font-semibold mb-1">
                  <span>Starred Ideas</span>
                  <Icon name="star" className="w-4 h-4 text-amber-400 fill-amber-400 group-hover:scale-110 transition-transform" />
                </div>
                <div className="text-2xl font-serif font-bold text-amber-200">{starredIdeasCount}</div>
              </button>

              <button
                onClick={() => scrollToSection('study-section')}
                className="executive-card executive-card-hover p-3.5 rounded-2xl text-left border border-amber-900/30 group"
              >
                <div className="flex items-center justify-between text-stone-400 text-xs font-semibold mb-1">
                  <span>Total Study</span>
                  <Icon name="bookOpen" className="w-4 h-4 text-amber-500 group-hover:scale-110 transition-transform" />
                </div>
                <div className="text-2xl font-serif font-bold text-amber-100">{totalStudies}</div>
              </button>

              <button
                onClick={() => scrollToSection('platforms-section')}
                className="executive-card executive-card-hover p-3.5 rounded-2xl text-left border border-amber-900/30 group col-span-2 sm:col-span-1"
              >
                <div className="flex items-center justify-between text-stone-400 text-xs font-semibold mb-1">
                  <span>Active Platforms</span>
                  <Icon name="globe" className="w-4 h-4 text-amber-400 group-hover:scale-110 transition-transform" />
                </div>
                <div className="text-2xl font-serif font-bold text-amber-200">{activePlatforms}</div>
              </button>
            </div>

            {/* 4. UNIFIED GLOBAL SEARCH BAR */}
            <div className="executive-card rounded-2xl p-4 space-y-3">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="relative w-full sm:flex-1">
                  <Icon name="search" className="w-4 h-4 text-amber-500 absolute left-3.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    placeholder="Search Projects, Ideas, Study topics across the entire system..."
                    value={globalSearch}
                    onChange={(e) => setGlobalSearch(e.target.value)}
                    className="w-full pl-10 pr-4 py-2 rounded-xl bg-stone-950 border border-stone-800 text-sm text-stone-200 placeholder-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-600/50"
                  />
                  {globalSearch && (
                    <button
                      onClick={() => setGlobalSearch('')}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-500 hover:text-stone-300"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  )}
                </div>

                <div className="flex items-center space-x-1 bg-stone-950 p-1 rounded-xl border border-stone-800 self-start sm:self-auto">
                  {['All', 'Projects', 'Ideas', 'Study'].map(tab => (
                    <button
                      key={tab}
                      onClick={() => setSearchTab(tab)}
                      className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all ${
                        searchTab === tab
                          ? 'bg-amber-600 text-stone-950 font-bold'
                          : 'text-stone-400 hover:text-stone-200'
                      }`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* 5. BULK SELECTION ACTION FLOATING BAR */}
            {selectedItemIds.size > 0 && (
              <div className="sticky top-16 z-40 executive-card rounded-2xl p-3 border border-amber-600/60 bg-amber-950/80 shadow-2xl flex items-center justify-between animate-fade-in">
                <div className="flex items-center space-x-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping" />
                  <span className="text-xs font-bold text-amber-200">
                    {selectedItemIds.size} Items Selected for Export
                  </span>
                </div>
                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => setSelectedItemIds(new Set())}
                    className="px-2.5 py-1 rounded-lg text-xs font-semibold text-stone-400 hover:text-white"
                  >
                    Clear
                  </button>
                  <button
                    onClick={handleSendSelectedViaEmail}
                    className="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs flex items-center space-x-1.5 shadow-md transition-all"
                  >
                    <Icon name="mail" className="w-3.5 h-3.5" />
                    <span>Send Selected via Email</span>
                  </button>
                </div>
              </div>

            {/* 6. PROJECTS SECTION */}
            {(searchTab === 'All' || searchTab === 'Projects') && (
              <section id="projects-section" className="space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-stone-800 pb-3">
                  <div className="flex items-center space-x-2">
                    <Icon name="folder" className="w-5 h-5 text-amber-500" />
                    <h2 className="font-serif font-bold text-xl text-stone-100">Executive Projects</h2>
                    <span className="text-xs font-mono font-bold px-2 py-0.5 rounded-full bg-amber-950 text-amber-300 border border-amber-800/40">
                      {filteredProjects.length}
                    </span>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    {/* Category Filter */}
                    <select
                      value={selectedProjectCategory}
                      onChange={(e) => setSelectedProjectCategory(e.target.value)}
                      className="px-2.5 py-1.5 rounded-xl bg-stone-900 border border-stone-800 text-xs font-semibold text-stone-300 focus:outline-none cursor-pointer"
                    >
                      <option value="All">All Categories</option>
                      {projectCategories.map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>

                    {/* Manage Project Categories */}
                    <button
                      onClick={() => { setCategoryModalType('Project'); setIsCategoryModalOpen(true); }}
                      className="p-1.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-stone-400 border border-stone-800 text-xs"
                      title="Manage Project Categories"
                    >
                      <Icon name="tag" className="w-3.5 h-3.5 text-amber-400" />
                    </button>

                    {/* Progress Sort Button */}
                    <button
                      onClick={() => setSortByProgress(!sortByProgress)}
                      className={`px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1 border transition-all ${
                        sortByProgress
                          ? 'bg-amber-600 text-stone-950 font-bold border-amber-500'

                      <Icon name="sort" className="w-3.5 h-3.5" />

                    {/* Star Filter Button */}

                      onClick={() => setOnlyStarredProjects(!onlyStarredProjects)}
                      className={`px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1 border transition-all ${
                        onlyStarredProjects
                          ? 'bg-amber-500 text-stone-950 font-bold border-amber-400'
                          : 'bg-stone-900 text-stone-300 border-stone-800 hover:bg-stone-800'

                    >
                      <Icon name="star" className={`w-3.5 h-3.5 ${onlyStarredProjects ? 'fill-stone-950' : 'text-amber-400'}`} />
                      <span>Starred</span>
                    </button>

                    <button
                      onClick={() => { setEditingProject(null); setIsProjectModalOpen(true); }}
                      className="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs flex items-center space-x-1 shadow-md"
                    >
                      <Icon name="plus" className="w-3.5 h-3.5" />
                      <span>+ New Project</span>
                    </button>

                {/* Projects Grid */}
                {filteredProjects.length === 0 ? (
                  <div className="text-center py-12 executive-card rounded-2xl border border-dashed border-stone-800">

                      const isSelected = selectedItemIds.has(project.id);

                      return (
                        <div

                          className={`executive-card executive-card-hover rounded-2xl p-4 flex flex-col justify-between space-y-3 ${

                        >
                          <div>

                            <div className="flex items-center justify-between mb-2">
                              <div className="flex items-center space-x-2">
                                <input
                                  type="checkbox"
                                  checked={isSelected}
                                  onChange={() => toggleItemSelection(project.id)}
                                  className="w-4 h-4 rounded bg-stone-950 border-stone-700 text-amber-600 focus:ring-amber-500 cursor-pointer"

                                <span className="text-lg">{project.emoji || '💼'}</span>

                                >
                                  <Icon
                                    name="star"

                                  />
                                </button>

                                <button
                                  onClick={() => { setEditingProject(project); setIsProjectModalOpen(true); }}
                                  className="p-1 rounded hover:bg-stone-800 text-stone-400 hover:text-stone-200"

                                  <Icon name="edit" className="w-3.5 h-3.5" />

            <section id="mindset-section" className="space-y-4">

                  <span>+ Add Mindset</span>

              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {mindsets.map((m) => (
                  <div key={m.id} className="executive-card rounded-2xl p-4 flex items-start justify-between space-x-3">
                    <div className="space-y-1">

                      <span className="text-[10px] font-mono text-stone-500 block">Logged: {m.createdAt}</span>
                    </div>
                    <button
                      onClick={() => deleteEntity('mindsets', m.id)}

                      <Icon name="trash" className="w-3.5 h-3.5" />
                    </button>

            {/* 10. PLATFORMS SECTION (Up to 50 Platforms) */}

                  <h2 className="font-serif font-bold text-xl text-stone-100">Platforms ({platforms.length}/50)</h2>
                </div>

                <button
                  onClick={() => setIsPlatformModalOpen(true)}

                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>+ Add Platform</span>
                </button>
              </div>

              {platforms.length === 0 ? (
                <div className="text-center py-8 executive-card rounded-2xl border border-dashed border-stone-800">
                  <p className="text-xs text-stone-500 font-medium">No external platforms connected.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {platforms.map(plat => (
                    <div key={plat.id} className="executive-card rounded-2xl p-3 flex items-center justify-between space-x-2 group">
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center space-x-1.5">
                          <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-stone-800 text-amber-300">
                            {plat.category || 'General'}
                          </span>
                          <span className="font-bold text-xs text-amber-100 truncate">{plat.title}</span>
                        </div>
                        <div className="mt-1">
                          <InlineUrls urls={plat.urls} />
                        </div>
                      </div>
                      <button
                        onClick={() => deleteEntity('platforms', plat.id)}
                        className="text-stone-500 hover:text-red-400 p-1 opacity-0 group-hover:opacity-100 transition-opacity"
                      >
                        <Icon name="trash" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </section>

          </main>

          {/* MODALS */}

          {/* Project Modal */}
          {isProjectModalOpen && (
            <ProjectModal
              isOpen={isProjectModalOpen}
              onClose={() => setIsProjectModalOpen(false)}
              onSave={(data) => {
                saveEntity('projects', data);
                setIsProjectModalOpen(false);
              }}
              initialData={editingProject}
              categories={projectCategories}
            />
          )}

          {/* Idea Modal */}
          {isIdeaModalOpen && (
            <IdeaModal
              isOpen={isIdeaModalOpen}
              onClose={() => setIsIdeaModalOpen(false)}
              onSave={(data) => {
                saveEntity('ideas', data);
                setIsIdeaModalOpen(false);
              }}
              initialData={editingIdea}
              categories={ideaCategories}
            />
          )}

          {/* Simple Inputs Modals */}
          {isStudyModalOpen && (
            <SimpleInputModal
              title="Add RnD Study Topic"
              fields={[
                { name: 'title', label: 'Study Title', required: true },
                { name: 'summary', label: 'Key Summary / Findings', type: 'textarea' },
                { name: 'urls', label: 'Multi URLs', placeholder: 'Enter multiple URLs separated by commas' }
              ]}
              onClose={() => setIsStudyModalOpen(false)}
              onSave={(data) => { saveEntity('studies', data); setIsStudyModalOpen(false); }}
            />
          )}

          {isMindsetModalOpen && (
            <SimpleInputModal
              title="Add Executive Mindset"
              fields={[
                { name: 'quote', label: 'Executive Mindset Quote', required: true, type: 'textarea' }

              onClose={() => setIsMindsetModalOpen(false)}
              onSave={(data) => { saveEntity('mindsets', data); setIsMindsetModalOpen(false); }}
            />
          )}

          {isPlatformModalOpen && (
            <SimpleInputModal
              title="Add External Platform"
              fields={[
                { name: 'category', label: 'Platform Category' },
                { name: 'title', label: 'Platform Title', required: true },
                { name: 'urls', label: 'Multi URLs', placeholder: 'Enter multiple URLs separated by commas' }
              ]}
              onClose={() => setIsPlatformModalOpen(false)}
              onSave={(data) => { saveEntity('platforms', data); setIsPlatformModalOpen(false); }}
            />
          )}

          {/* Category Management Modal */}
          {isCategoryModalOpen && (
            <CategoryManagerModal
              type={categoryModalType}
              categories={categoryModalType === 'Project' ? projectCategories : ideaCategories}
              onClose={() => setIsCategoryModalOpen(false)}
              onUpdate={(newList) => {
                if (categoryModalType === 'Project') {
                  setProjectCategories(newList);
                  localStorage.setItem('ai_ceo_proj_cat_v3', JSON.stringify(newList));
                } else {
                  setIdeaCategories(newList);
                  localStorage.setItem('ai_ceo_idea_cat_v3', JSON.stringify(newList));
                }
              }}
            />
          )}

          {/* Company Profile Modal */}
          {isProfileModalOpen && (
            <ProfileModal
              profile={companyProfile}
              onClose={() => setIsProfileModalOpen(false)}
              onSave={(updated) => {
                setCompanyProfile(updated);
                localStorage.setItem('ai_ceo_profile_v3', JSON.stringify(updated));
                setIsProfileModalOpen(false);
              }}
            />
          )}

          {/* Firebase Auth Modal */}
          {isAuthModalOpen && (
            <AuthModal
              onClose={() => setIsAuthModalOpen(false)}
              user={user}
            />
          )}

        </div>
      );
    }

    // --- MODAL COMPONENTS ---

    // Project Modal
    function ProjectModal({ isOpen, onClose, onSave, initialData, categories }) {
      const [formData, setFormData] = useState({
        id: initialData?.id || '',
        category: initialData?.category || categories[0] || 'Head Quarter',
        company: initialData?.company || '',
        title: initialData?.title || '',
        status: initialData?.status || 'In Progress',
        progress: initialData?.progress || 50,
        emoji: initialData?.emoji || '🚀',
        objective: initialData?.objective || '',
        aiPrompt: initialData?.aiPrompt || '',
        urls: initialData?.urls || '',
        isStarred: initialData?.isStarred || false
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="executive-card rounded-3xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-stone-800 pb-3">
              <h3 className="font-serif font-bold text-lg text-amber-100">
                {initialData ? 'Edit Executive Project' : 'New Executive Project'}
              </h3>
              <button onClick={onClose} className="text-stone-500 hover:text-stone-200">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {/* Emoji Selector */}
              <div>
                <label className="text-xs font-bold text-amber-300 block mb-1">Project Icon Emoji</label>
                <div className="flex flex-wrap gap-2">
                  {EMOJI_LIST.map(em => (
                    <button
                      key={em}
                      type="button"
                      onClick={() => setFormData({ ...formData, emoji: em })}
                      className={`text-lg p-2 rounded-xl transition-all ${
                        formData.emoji === em ? 'bg-amber-600/40 ring-2 ring-amber-500 scale-110' : 'bg-stone-900 hover:bg-stone-800'
                      }`}
                    >
                      {em}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-stone-300 block mb-1">Category *</label>
                  <select
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                  >
                    {categories.map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="text-xs font-bold text-stone-300 block mb-1">Company / Sub-Brand</label>
                  <input
                    type="text"
                    placeholder="e.g. SISTAR Group"
                    value={formData.company}
                    onChange={(e) => setFormData({ ...formData, company: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-stone-300 block mb-1">Project Title *</label>
                <input
                  type="text"
                  required
                  placeholder="Enter project title"
                  value={formData.title}
                  onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-amber-300 block mb-1">One-Line Objective</label>
                <input
                  type="text"
                  placeholder="State the core measurable success outcome"
                  value={formData.objective}
                  onChange={(e) => setFormData({ ...formData, objective: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-stone-300 block mb-1">AI Context & Prompt Vector</label>
                <textarea
                  rows={2}
                  placeholder="Provide instruction context for AI assistant"
                  value={formData.aiPrompt}
                  onChange={(e) => setFormData({ ...formData, aiPrompt: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-stone-300 block mb-1">Status</label>
                  <select
                    value={formData.status}
                    onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"

                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                    <option value="On Hold">On Hold</option>
                  </select>

                <div>
                  <label className="text-xs font-bold text-stone-300 block mb-1">Progress: {formData.progress}%</label>

                    type="range"

                    value={formData.progress}
                    onChange={(e) => setFormData({ ...formData, progress: Number(e.target.value) })}

                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-stone-300 block mb-1">Multi URLs</label>
                <input
                  type="text"
                  placeholder="Enter multiple URLs separated by commas"
                  value={formData.urls}
                  onChange={(e) => setFormData({ ...formData, urls: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600 font-mono"
                />

              <div className="flex justify-end space-x-2 pt-3 border-t border-stone-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-stone-900 text-stone-400 text-xs font-semibold hover:bg-stone-800"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs shadow-md"
                >
                  Save Project
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Idea Modal
    function IdeaModal({ isOpen, onClose, onSave, initialData, categories }) {
      const [formData, setFormData] = useState({
        id: initialData?.id || '',
        category: initialData?.category || categories[0] || 'Core Tech',
        title: initialData?.title || '',
        content: initialData?.content || '',
        urls: initialData?.urls || '',
        stars: initialData?.stars || 1,
        isArchived: initialData?.isArchived || false
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="executive-card rounded-3xl max-w-lg w-full p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-stone-800 pb-3">
              <h3 className="font-serif font-bold text-lg text-amber-100">
                {initialData ? 'Edit Executive Idea' : 'New Executive Idea'}
              </h3>
              <button onClick={onClose} className="text-stone-500 hover:text-stone-200">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-stone-300 block mb-1">Category</label>
                  <select
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                  >
                    {categories.map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="text-xs font-bold text-amber-300 block mb-1">Star Priority</label>
                  <div className="flex items-center space-x-2 bg-stone-950 p-1.5 rounded-xl border border-stone-800">
                    {[1, 2, 3].map(s => (
                      <button
                        type="button"
                        key={s}
                        onClick={() => setFormData({ ...formData, stars: s })}
                        className={`px-2 py-1 rounded-lg text-xs font-bold flex items-center space-x-1 ${
                          formData.stars === s ? 'bg-amber-600 text-stone-950' : 'text-stone-400 hover:text-white'
                        }`}
                      >
                        <Icon name="star" className="w-3 h-3 fill-current" />
                        <span>{s}★</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-stone-300 block mb-1">Idea Title *</label>
                <input
                  type="text"
                  required
                  placeholder="Summarize the core innovation concept"
                  value={formData.title}
                  onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-stone-300 block mb-1">Description (Optional)</label>
                <textarea
                  rows={3}
                  placeholder="Elaborate details or market opportunities"
                  value={formData.content}
                  onChange={(e) => setFormData({ ...formData, content: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-stone-300 block mb-1">Multi URLs</label>
                <input
                  type="text"
                  placeholder="Enter multiple URLs separated by commas"
                  value={formData.urls}
                  onChange={(e) => setFormData({ ...formData, urls: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600 font-mono"
                />
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t border-stone-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-stone-900 text-stone-400 text-xs font-semibold hover:bg-stone-800"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs shadow-md"
                >
                  Save Idea
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Generic Simple Input Modal
    function SimpleInputModal({ title, fields, onClose, onSave }) {
      const [formData, setFormData] = useState({});

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="executive-card rounded-3xl max-w-md w-full p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-stone-800 pb-3">
              <h3 className="font-serif font-bold text-lg text-amber-100">{title}</h3>
              <button onClick={onClose} className="text-stone-500 hover:text-stone-200">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {fields.map(field => (
                <div key={field.name}>
                  <label className="text-xs font-bold text-stone-300 block mb-1">{field.label}</label>
                  {field.type === 'textarea' ? (
                    <textarea
                      rows={3}
                      required={field.required}
                      placeholder={field.placeholder || ''}
                      value={formData[field.name] || ''}
                      onChange={(e) => setFormData({ ...formData, [field.name]: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                    />
                  ) : (
                    <input
                      type="text"
                      required={field.required}
                      placeholder={field.placeholder || ''}
                      value={formData[field.name] || ''}
                      onChange={(e) => setFormData({ ...formData, [field.name]: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                    />
                  )}
                </div>
              ))}

              <div className="flex justify-end space-x-2 pt-3 border-t border-stone-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-stone-900 text-stone-400 text-xs font-semibold hover:bg-stone-800"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs shadow-md"
                >
                  Save Entry
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Category Manager Modal
    function CategoryManagerModal({ type, categories, onClose, onUpdate }) {
      const [newCat, setNewCat] = useState('');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newCat.trim()) return;
        if (categories.length >= 30) {
          alert('Maximum limit of 30 categories reached.');
          return;
        }
        if (categories.includes(newCat.trim())) {
          alert('Category already exists.');
          return;
        }
        onUpdate([...categories, newCat.trim()]);
        setNewCat('');
      };

      const handleDelete = (catName) => {
        onUpdate(categories.filter(c => c !== catName));
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="executive-card rounded-3xl max-w-md w-full p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-stone-800 pb-3">
              <h3 className="font-serif font-bold text-lg text-amber-100">
                Manage {type} Categories ({categories.length}/30)
              </h3>
              <button onClick={onClose} className="text-stone-500 hover:text-stone-200">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleAdd} className="flex items-center space-x-2">
              <input
                type="text"
                placeholder={`+ Add ${type} Category`}
                value={newCat}
                onChange={(e) => setNewCat(e.target.value)}
                className="flex-1 px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
              />
              <button
                type="submit"
                className="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs"
              >
                Add
              </button>
            </form>

            <div className="max-h-60 overflow-y-auto space-y-1.5 pt-2">
              {categories.map((c) => (
                <div key={c} className="flex items-center justify-between px-3 py-2 rounded-xl bg-stone-950 border border-stone-800/80 text-xs">
                  <span className="text-amber-200 font-medium">{c}</span>
                  <button
                    onClick={() => handleDelete(c)}
                    className="text-stone-500 hover:text-red-400 p-1"
                  >
                    <Icon name="trash" className="w-3.5 h-3.5" />
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Company Profile Modal
    function ProfileModal({ profile, onClose, onSave }) {
      const [data, setData] = useState(profile);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(data);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="executive-card rounded-3xl max-w-md w-full p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-stone-800 pb-3">
              <h3 className="font-serif font-bold text-lg text-amber-100">Company Profile Settings</h3>
              <button onClick={onClose} className="text-stone-500 hover:text-stone-200">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-bold text-stone-300 block mb-1">Company / Group Name</label>
                <input
                  type="text"
                  required
                  value={data.companyName}
                  onChange={(e) => setData({ ...data, companyName: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                />
              </div>

              <div>
                <label className="text-xs font-bold text-stone-300 block mb-1">Logo Image URL</label>
                <input
                  type="text"
                  placeholder="https://example.com/logo.png"
                  value={data.logoUrl || ''}
                  onChange={(e) => setData({ ...data, logoUrl: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                />
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t border-stone-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl bg-stone-900 text-stone-400 text-xs font-semibold hover:bg-stone-800"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs shadow-md"
                >
                  Save Profile
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Auth Modal
    function AuthModal({ onClose, user }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const handleGoogle = async () => {
        if (!window.firebase || !firebase.apps.length) {
          alert('Firebase SDK is initializing or not configured.');
          return;
        }
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await firebase.auth().signInWithPopup(provider);
          onClose();
        } catch (err) {
          alert(err.message);
        }
      };

      const handleEmail = async (e) => {
        e.preventDefault();
        if (!window.firebase || !firebase.apps.length) return;
        try {
          await firebase.auth().signInWithEmailAndPassword(email, password);
          onClose();
        } catch (err) {
          try {
            await firebase.auth().createUserWithEmailAndPassword(email, password);
            onClose();
          } catch (e2) {
            alert(e2.message);
          }
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="executive-card rounded-3xl max-w-sm w-full p-6 space-y-4 text-center">
            <div className="flex items-center justify-between border-b border-stone-800 pb-3">
              <h3 className="font-serif font-bold text-lg text-amber-100">Firebase Authentication</h3>
              <button onClick={onClose} className="text-stone-500 hover:text-stone-200">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {user ? (
              <div className="space-y-3 py-4">
                <p className="text-xs text-stone-300">Logged in as:</p>
                <p className="font-bold text-amber-300 text-sm">{user.email}</p>
                <button
                  onClick={() => { firebase.auth().signOut(); onClose(); }}
                  className="w-full py-2 rounded-xl bg-red-900/50 hover:bg-red-800/50 text-red-300 border border-red-700 text-xs font-bold"
                >
                  Log Out
                </button>
              </div>
            ) : (
              <div className="space-y-4 pt-2">
                <button
                  onClick={handleGoogle}
                  className="w-full py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-amber-200 border border-amber-900/40 font-bold text-xs flex items-center justify-center space-x-2"
                >
                  <Icon name="sparkles" className="w-4 h-4 text-amber-400" />
                  <span>Sign In with Google</span>
                </button>

                <div className="relative my-2">
                  <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-stone-800"></div></div>
                  <div className="relative text-[10px] uppercase text-stone-500 font-bold bg-stone-900 px-2 inline-block">Or Email Login</div>
                </div>

                <form onSubmit={handleEmail} className="space-y-3 text-left">
                  <div>
                    <label className="text-[11px] font-bold text-stone-400 block mb-1">Email Address</label>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-stone-400 block mb-1">Password</label>
                    <input
                      type="password"
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-stone-950 border border-stone-800 text-xs text-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-600"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-xs shadow-md"
                  >
                    Sign In / Register
                  </button>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
