    // --- Google Favicon & Domain Link Parser ---
    const parseDomainLinks = (urlsInput) => {
      if (!urlsInput) return [];
      const list = typeof urlsInput === 'string'
        ? urlsInput.split(',').map(u => u.trim()).filter(Boolean)
        : Array.isArray(urlsInput) ? urlsInput : [];

      return list.map((url, index) => {
        let domain = `Link ${index + 1}`;
        let cleanHost = 'google.com';
        try {
          const formattedUrl = url.startsWith('http://') || url.startsWith('https://') ? url : `https://${url}`;
          const parsed = new URL(formattedUrl);
          cleanHost = parsed.hostname.replace('www.', '');
          const parts = cleanHost.split('.');
          domain = parts.length >= 2 ? parts[0] : cleanHost;
        } catch (e) {
          domain = `Link ${index + 1}`;
          cleanHost = 'google.com';
        }
        const href = url.startsWith('http://') || url.startsWith('https://') ? url : `https://${url}`;
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${cleanHost}&sz=32`;
        return { domain, href, faviconUrl, original: url };
      });
    };

    function App() {
      // Firebase Auth User
      const [user, setUser] = useState(null);

      // Categories State
      const [projectCategories, setProjectCategories] = useState(() => {

      });
      const [ideaCategories, setIdeaCategories] = useState(() => {
        const saved = localStorage.getItem('aiceo_v7_idea_cats');

      // App Data States
      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('aiceo_v7_projects');
        return saved ? JSON.parse(saved) : DEFAULT_PROJECTS;
      });
      const [ideas, setIdeas] = useState(() => {
        const saved = localStorage.getItem('aiceo_v7_ideas');
        return saved ? JSON.parse(saved) : DEFAULT_IDEAS;
      });
      const [studies, setStudies] = useState(() => {
        const saved = localStorage.getItem('aiceo_v7_studies');
        return saved ? JSON.parse(saved) : DEFAULT_STUDIES;
      });
      const [mindsets, setMindsets] = useState(() => {
        const saved = localStorage.getItem('aiceo_v7_mindsets');
        return saved ? JSON.parse(saved) : DEFAULT_MINDSETS;
      });
      const [platforms, setPlatforms] = useState(() => {
        const saved = localStorage.getItem('aiceo_v7_platforms');
        return saved ? JSON.parse(saved) : DEFAULT_PLATFORMS;
      });

      // Selection State for Bulk Multi-Action Bar
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [instructionPrompt, setInstructionPrompt] = useState('');

      // Search State & Filter Controls
      const [globalSearch, setGlobalSearch] = useState('');
      const [isSearchFocused, setIsSearchFocused] = useState(false);
      const [selectedProjCat, setSelectedProjCat] = useState('All');
      const [selectedIdeaCat, setSelectedIdeaCat] = useState('All');

      // Sorting States per Quadrant Box
      const [sortProjectBy, setSortProjectBy] = useState('Date'); // Title, Date, Progress %, Company
      const [sortIdeaBy, setSortIdeaBy] = useState('Date'); // Title, Date, Stars
      const [sortStudyBy, setSortStudyBy] = useState('Date'); // Title, Date
      const [sortMindsetBy, setSortMindsetBy] = useState('Date'); // Title, Date

      // Pagination States (20 items per page)
      const [pageProjects, setPageProjects] = useState(0);
      const [pageIdeas, setPageIdeas] = useState(0);
      const [pageStudies, setPageStudies] = useState(0);
      const [pageMindsets, setPageMindsets] = useState(0);

      // Modal Control States
      const [activeModalItem, setActiveModalItem] = useState(null); // { type, item, isNew }
      const [isCatModalOpen, setIsCatModalOpen] = useState(false);
      const [catModalType, setCatModalType] = useState('Project');
      const [isPlatformModalOpen, setIsPlatformModalOpen] = useState(false);
      const [isBrandingModalOpen, setIsBrandingModalOpen] = useState(false);
      const [isSloganModalOpen, setIsSloganModalOpen] = useState(false);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);

      // Firebase Initialization
      useEffect(() => {
        if (firebaseConfig && firebaseConfig.apiKey) {
          try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const unsub = firebase.auth().onAuthStateChanged(u => setUser(u));
            return () => unsub();
          } catch (e) {
            console.error('Firebase Initialization Error:', e);
          }
        }
      }, [firebaseConfig]);

      // Firebase Firestore Synchronization
      useEffect(() => {
        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const userRef = db.collection('users').doc(user.uid);

          const unsubProjects = userRef.collection('projects').onSnapshot((snap) => {
            if (!snap.empty) setProjects(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
          const unsubIdeas = userRef.collection('ideas').onSnapshot((snap) => {
            if (!snap.empty) setIdeas(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
          const unsubStudies = userRef.collection('studies').onSnapshot((snap) => {
            if (!snap.empty) setStudies(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
          const unsubMindsets = userRef.collection('mindsets').onSnapshot((snap) => {
            if (!snap.empty) setMindsets(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
          const unsubPlatforms = userRef.collection('platforms').onSnapshot((snap) => {
            if (!snap.empty) setPlatforms(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });

          return () => {
            unsubProjects(); unsubIdeas(); unsubStudies(); unsubMindsets(); unsubPlatforms();
          };
        }
      }, [user]);

      // Save Item Handler
      const saveItem = async (type, itemData) => {
        const id = itemData.id || `${type}_${Date.now()}`;
        const finalItem = { ...itemData, id, updatedAt: new Date().toISOString().split('T')[0] };

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          await db.collection('users').doc(user.uid).collection(type).doc(id).set(finalItem, { merge: true });
        } else {
          const updaters = {
            projects: [setProjects, 'aiceo_v7_projects'],
            ideas: [setIdeas, 'aiceo_v7_ideas'],
            studies: [setStudies, 'aiceo_v7_studies'],
            mindsets: [setMindsets, 'aiceo_v7_mindsets'],
            platforms: [setPlatforms, 'aiceo_v7_platforms'],
          };

          if (updaters[type]) {
            const [setFn, key] = updaters[type];
            setFn(prev => {
              const exists = prev.some(i => i.id === id);
              const next = exists ? prev.map(i => i.id === id ? finalItem : i) : [finalItem, ...prev];
              localStorage.setItem(key, JSON.stringify(next));
              return next;
            });
          }
        }
        setActiveModalItem(null);
      };

      // Delete Item Handler
      const deleteItem = async (type, id) => {
        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          await db.collection('users').doc(user.uid).collection(type).doc(id).delete();
        } else {
          const updaters = {
            projects: [setProjects, 'aiceo_v7_projects'],
            ideas: [setIdeas, 'aiceo_v7_ideas'],
            studies: [setStudies, 'aiceo_v7_studies'],
            mindsets: [setMindsets, 'aiceo_v7_mindsets'],
            platforms: [setPlatforms, 'aiceo_v7_platforms'],
          };

          if (updaters[type]) {
            const [setFn, key] = updaters[type];
            setFn(prev => {
              const next = prev.filter(i => i.id !== id);
              localStorage.setItem(key, JSON.stringify(next));
              return next;
            });
          }
        }
        setActiveModalItem(null);
      };

      // Bulk Delete Selected Handler
      const handleBulkDelete = async () => {
        if (selectedIds.size === 0) return;
        if (!confirm(`Are you sure you want to delete ${selectedIds.size} selected item(s)?`)) return;

        const allTypes = ['projects', 'ideas', 'studies', 'mindsets', 'platforms'];
        for (const id of selectedIds) {
          for (const type of allTypes) {
            await deleteItem(type, id);
          }
        }
        setSelectedIds(new Set());
      };

      // Save Platforms Bulk List
      const handleSavePlatforms = async (newList) => {
        setPlatforms(newList);
        localStorage.setItem('aiceo_v7_platforms', JSON.stringify(newList));

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const batch = db.batch();
          const userRef = db.collection('users').doc(user.uid);
          
          newList.forEach(p => {
            const docRef = userRef.collection('platforms').doc(p.id || `plat_${Date.now()}`);
            batch.set(docRef, p, { merge: true });
          });
          await batch.commit();

      // Category Updates
      const saveCategories = (type, list) => {

          localStorage.setItem('aiceo_v7_idea_cats', JSON.stringify(list));

        setIsBrandingModalOpen(false);
        setIsSloganModalOpen(false);

      // Toggle Selection (Only toggles selection, does NOT open edit modal)
      const toggleSelect = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      // Send Email with Selected Items & Executive Instruction
      const handleSendEmail = () => {
        if (selectedIds.size === 0) return;
        const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = all.filter(item => selectedIds.has(item.id));

        let body = `Executive Briefing - ${branding.title}\nDate: ${new Date().toLocaleDateString()}\n\n`;
        if (instructionPrompt.trim()) {
          body += `[Executive Directives / Instruction]:\n${instructionPrompt.trim()}\n----------------------------------------\n\n`;
        }

        body += `Selected Memory Items (${selectedList.length}):\n\n`;
        selectedList.forEach((item, index) => {
          body += `${index + 1}. ${item.title || item.details}\n`;
          if (item.company) body += `   Company: ${item.company}\n`;
          if (item.category) body += `   Category: ${item.category}\n`;
          if (item.status) body += `   Status: ${item.status} (${item.progress}%)\n`;
          if (item.objective) body += `   Objectives:\n${item.objective}\n`;
          if (item.aiPrompt) body += `   AI Context:\n${item.aiPrompt}\n`;
          if (item.urls) body += `   URLs: ${item.urls}\n`;
          body += `\n`;
        });

        window.location.href = `mailto:?subject=${encodeURIComponent(`[${branding.title}] Selected Executive Directives & Briefing`)}&body=${encodeURIComponent(body)}`;

      // Export CSV
      const handleExportCSV = () => {
        let csv = "Type,Title,Category,Company/Details,Status/Progress,Objectives,AI Prompt Vector,URLs,Date\n";

        projects.forEach(p => {
          csv += `"Project","${(p.title||'').replace(/"/g, '""')}","${p.category||''}","${p.company||''}","${p.status} (${p.progress}%)","${(p.objective||'').replace(/"/g, '""')}","${(p.aiPrompt||'').replace(/"/g, '""')}","${p.urls||''}","${p.updatedAt||''}"\n`;
        });
        ideas.forEach(i => {
          csv += `"Idea","${(i.title||'').replace(/"/g, '""')}","${i.category||''}","${(i.details||'').replace(/"/g, '""')}","Stars: ${i.stars||0}","N/A","N/A","${i.urls||''}","${i.createdAt||''}"\n`;
        });
        studies.forEach(s => {
          csv += `"Study","${(s.title||'').replace(/"/g, '""')}","RnD","${(s.details||'').replace(/"/g, '""')}","N/A","N/A","N/A","${s.urls||''}","${s.createdAt||''}"\n`;
        });
        mindsets.forEach(m => {
          csv += `"Mindset","${(m.title||'').replace(/"/g, '""')}","Executive","${(m.details||'').replace(/"/g, '""')}","N/A","N/A","N/A","${m.urls||''}","${m.createdAt||''}"\n`;
        });
        platforms.forEach(pl => {
          csv += `"Platform","${(pl.title||'').replace(/"/g, '""')}","${pl.category||''}","N/A","N/A","N/A","N/A","${pl.urls||''}","${pl.createdAt||''}"\n`;
        });

        const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csv);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `AI_CEO_Executive_Export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Copy for AI Context
      const handleCopyForAI = (item) => {
        let md = '';
        if (item) {
          md = `### [${item.category || 'Executive'}] ${item.title || item.details}\n`;
          if (item.company) md += `**Company**: ${item.company}\n`;
          if (item.objective) md += `**Targets**:\n${item.objective}\n`;
          if (item.aiPrompt) md += `**AI Prompts for Actions**:\n${item.aiPrompt}\n`;
          if (item.details) md += `**Details**: ${item.details}\n`;
          if (item.urls) md += `**URLs**: ${item.urls}\n`;
        } else if (selectedIds.size > 0) {
          const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
          const list = all.filter(i => selectedIds.has(i.id));
          md = `# ${branding.title} Executive Prompt & Selected Memory Context (${list.length})\nDate: ${new Date().toLocaleDateString()}\n\n`;
          if (instructionPrompt.trim()) {
            md += `## Executive Instruction / Directive:\n${instructionPrompt.trim()}\n\n---\n\n`;
          }
          md += `## Selected Items:\n`;
          list.forEach(i => {
            md += `- **[${i.category || 'Exec'}] ${i.title || i.details}** (${i.company || 'N/A'})\n  Objectives/Details:\n${i.objective || i.details || 'N/A'}\n  AI Context:\n${i.aiPrompt || 'N/A'}\n  URLs: ${i.urls || 'None'}\n\n`;
          });
        } else {
          md = `# ${branding.title} Executive Memory & Dashboard Context\n\n`;
          md += `## Projects (${projects.length})\n`;
          projects.forEach(p => {
            md += `- **[${p.category}] ${p.title}** (${p.company}) | Progress: ${p.progress}%\n  Objectives:\n${p.objective || 'N/A'}\n  Prompt:\n${p.aiPrompt || 'N/A'}\n  URLs: ${p.urls || 'None'}\n`;
          });
          md += `\n## Ideas (${ideas.length})\n`;
          ideas.forEach(i => {
            md += `- **[${i.category}] ${i.title}** | Stars: ${i.stars || 0}\n  Details: ${i.details || 'N/A'}\n`;
          });
        }

        navigator.clipboard.writeText(md);
        alert('Copied Markdown context to clipboard!');
      };

      // Sorting Generic Utility
      const sortItems = (items, sortKey) => {
        return [...items].sort((a, b) => {
          if (sortKey === 'Title') {
            return (a.title || a.details || '').localeCompare(b.title || b.details || '');
          }
          if (sortKey === 'Company') {
            return (a.company || '').localeCompare(b.company || '');
          }
          if (sortKey === 'Progress %') {
            return (b.progress || 0) - (a.progress || 0);
          }
          if (sortKey === 'Stars') {
            return (b.stars || 0) - (a.stars || 0);
          }
          // Default Date Sort
          return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
        });
      };

      const processedProjects = useMemo(() => {
        const filtered = projects.filter(p => {
          const matchCat = selectedProjCat === 'All' || p.category === selectedProjCat;
          const matchQuery = !globalSearch.trim() ||
            p.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (p.company && p.company.toLowerCase().includes(globalSearch.toLowerCase())) ||
            (p.objective && p.objective.toLowerCase().includes(globalSearch.toLowerCase()));
          return matchCat && matchQuery;
        });
        return sortItems(filtered, sortProjectBy);
      }, [projects, selectedProjCat, globalSearch, sortProjectBy]);

      const processedIdeas = useMemo(() => {
        const filtered = ideas.filter(i => {
          const matchCat = selectedIdeaCat === 'All' || i.category === selectedIdeaCat;
          const matchQuery = !globalSearch.trim() ||
            i.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (i.details && i.details.toLowerCase().includes(globalSearch.toLowerCase()));

            (s.details && s.details.toLowerCase().includes(globalSearch.toLowerCase()));

      const processedMindsets = useMemo(() => {

            m.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (m.details && m.details.toLowerCase().includes(globalSearch.toLowerCase()));

        return sortItems(filtered, sortMindsetBy);
      }, [mindsets, globalSearch, sortMindsetBy]);

      // Global Search Live Dropdown Results
      const searchResults = useMemo(() => {
        if (!globalSearch.trim()) return [];
        const q = globalSearch.toLowerCase();

        projects.forEach(p => {
          if (p.title.toLowerCase().includes(q) || (p.company && p.company.toLowerCase().includes(q))) {

        ideas.forEach(i => {
          if (i.title.toLowerCase().includes(q) || (i.details && i.details.toLowerCase().includes(q))) {
            res.push({ type: 'ideas', item: i, boxName: 'Ideas', boxId: 'box-ideas', category: i.category });
          }
        });
        studies.forEach(s => {
          if (s.title.toLowerCase().includes(q) || (s.details && s.details.toLowerCase().includes(q))) {

        return res;
      }, [globalSearch, projects, ideas, studies, mindsets]);

      const [headerHeight, setHeaderHeight] = useState(44);

                {/* Step 1: Selection Status */}

          {/* MAIN BODY 2x2 QUADRANT GRID DASHBOARD (Desktop 2 Col, Mobile 1 Col) */}
          <main className="max-w-6xl w-full mx-auto px-4 py-4 grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">

              headerControls={

                  >
                    <option value="All">All Categories</option>
                    {projectCategories.map(c => <option key={c} value={c}>{c}</option>)}

                  <select

                if (!firebase.apps.length) return setIsConfigModalOpen(true);
                try {
                  const provider = new firebase.auth.GoogleAuthProvider();
                  await firebase.auth().signInWithPopup(provider);
                  setIsLoginModalOpen(false);
                } catch (e) { alert('Auth Error: ' + e.message); }
              }}
              onEmailLogin={async (e, email, pass, isSignUp) => {
                e.preventDefault();
                if (!firebase.apps.length) return setIsConfigModalOpen(true);
                try {
                  if (isSignUp) await firebase.auth().createUserWithEmailAndPassword(email, pass);
                  else await firebase.auth().signInWithEmailAndPassword(email, pass);
                  setIsLoginModalOpen(false);
                } catch (err) { alert('Auth Error: ' + err.message); }
              }}
              onOpenConfig={() => setIsConfigModalOpen(true)}
            />
          )}

          {/* FIREBASE CONFIG MODAL */}
          {isConfigModalOpen && (
            <ConfigModal
              currentConfig={firebaseConfig}
              onClose={() => setIsConfigModalOpen(false)}
              onSave={(cfg) => {
                setFirebaseConfig(cfg);
                localStorage.setItem('aiceo_v7_fb', JSON.stringify(cfg));
                setIsConfigModalOpen(false);
                alert('Firebase credentials saved. Reloading application...');
                window.location.reload();
              }}
            />
          )}

          {/* FOOTER */}
          <footer className="border-t border-gray-200 py-4 text-center text-xs text-grayholder">
            AI-CEO Executive Management System v7.0 • Single-File Executive Dashboard Architecture
          </footer>
        </div>
      );
    }

    // --- REUSABLE QUADRANT BOX COMPONENT ---
    // Displays ONLY actual created data rows (no empty placeholder rows)
    function QuadrantBox({ id, title, count, page, setPage, onAdd, headerControls, children }) {
      const pageSize = 20;
      const maxPages = Math.ceil(count / pageSize);
      const childArray = React.Children.toArray(children);

      return (
        <section id={id} className="border border-gray-200 rounded-xl p-4 bg-white shadow-sm flex flex-col justify-between space-y-2 min-h-[300px]">
          
          {/* Box Header */}
          <div className="flex items-center justify-between border-b border-gray-100 pb-2">
            <div className="flex items-center space-x-2">
              <span className="font-bold text-[13px] text-brandsky">{title}</span>
              <button
                onClick={onAdd}
                className="px-1.5 py-0.5 rounded bg-sky-50 text-brandsky hover:bg-sky-100 text-xs font-bold transition-colors cursor-pointer"
                title="Add New Item"
              >
                +
              </button>
              <span className="text-[10.5px] text-grayholder">({count})</span>
            </div>

            <div className="flex items-center space-x-2">
              {headerControls}
            </div>
          </div>

          {/* Rows Container - Only actual created data, no empty dots/dashes */}
          <div className="divide-y divide-gray-50 flex-1 min-h-[220px]">
            {childArray.length > 0 ? childArray : (
              <div className="py-12 text-center text-grayholder text-xs italic">
                No items in {title}. Click + to create a new item.
              </div>
            )}
          </div>

          {/* 20-Item Pagination Controls - ONLY active when count > 20 */}
          {count > 20 && (
            <div className="flex items-center justify-between pt-2 border-t border-gray-100 text-xs text-grayholder">
              <span>Page {page + 1} of {maxPages}</span>
              <div className="space-x-2">
                <button
                  disabled={page === 0}
                  onClick={() => setPage(p => Math.max(0, p - 1))}
                  className="disabled:opacity-30 hover:text-darkslate cursor-pointer"
                >
                  [Prev]
                </button>
                <button
                  disabled={page >= maxPages - 1}
                  onClick={() => setPage(p => Math.min(maxPages - 1, p + 1))}
                  className="disabled:opacity-30 hover:text-darkslate cursor-pointer"
                >
                  [Next]
                </button>
              </div>
            </div>
          )}
        </section>
      );

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Category (카테고리)</label>
                      <input
                        type="text"
                        value={plat.category || ''}
                        onChange={(e) => updatePlatform(plat.id, 'category', e.target.value)}
                        placeholder="Category"
                        className="w-full px-2 py-1 border border-gray-200 rounded text-xs focus:outline-none focus:border-brandorange font-bold text-gray-800"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Title (제목)</label>
                      <div className="flex items-center gap-1">
                        <input
                          type="text"
                          value={plat.title || ''}
                          onChange={(e) => updatePlatform(plat.id, 'title', e.target.value)}
                          placeholder="Title"
                          className="w-full px-2 py-1 border border-gray-200 rounded text-xs focus:outline-none focus:border-brandorange font-bold text-gray-800"
                        />
                        <button
                          type="button"
                          onClick={() => deletePlatform(plat.id)}
                          className="text-red-400 hover:text-red-600 px-1 text-xs font-bold cursor-pointer shrink-0"
                          title="Remove Platform"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-gray-700 mb-0.5">Links ( , for multi URLs)</label>
                    <input
                      type="text"
                      value={plat.urls || ''}
                      onChange={(e) => updatePlatform(plat.id, 'urls', e.target.value)}
                      placeholder="https://..."
                      className="w-full px-2 py-1 border border-gray-200 rounded text-xs text-slate-600 focus:outline-none"
                    />
                  </div>
                </div>
              ))}
            </div>

            <div className="flex items-center justify-between pt-2 border-t border-gray-100">
              <button
                type="button"
                onClick={addPlatform}
                className="px-2.5 py-1 bg-orange-50 text-brandorange rounded hover:bg-orange-100 text-xs font-bold cursor-pointer"
              >
                + Add Platform
              </button>
              <div className="space-x-1.5">
                <button onClick={onClose} className="px-2.5 py-1 border border-gray-200 rounded text-slate-600 cursor-pointer">
                  Cancel
                </button>
                <button onClick={() => onSave(list)} className="px-3.5 py-1 rounded bg-brandorange text-white hover:bg-orange-600 font-normal cursor-pointer">
                  Save
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- DYNAMIC CATEGORY EDITOR MODAL ---
    function CategoryEditorModal({ type, categories, onClose, onSave }) {
      const [list, setList] = useState([...categories]);
      const [newCat, setNewCat] = useState('');

      const addCategory = () => {
        if (!newCat.trim()) return;
        if (list.includes(newCat.trim())) return alert('Category already exists.');
        setList([...list, newCat.trim()]);
        setNewCat('');
      };

      const removeCategory = (cat) => {
        setList(list.filter(c => c !== cat));
      };

      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-5 space-y-4 border border-gray-200">
            <div className="flex items-center justify-between border-b border-gray-100 pb-2">
              <span className="font-bold text-sm text-brandsky">+ Manage {type} Categories</span>
              <button onClick={onClose} className="text-slate-400 hover:text-darkslate text-sm cursor-pointer">✕</button>
            </div>

            <div className="space-y-2">
              <div className="flex gap-2">
                <input
                  type="text"
                  value={newCat}
                  onChange={(e) => setNewCat(e.target.value)}
                  placeholder="New category..."
                  className="flex-1 px-2.5 py-1 border border-gray-200 rounded text-xs focus:outline-none"
                />
                <button onClick={addCategory} className="px-3 py-1 bg-brandsky text-white rounded text-xs cursor-pointer">
                  Add
                </button>
              </div>

              <div className="max-h-48 overflow-y-auto space-y-1.5 pt-2">
                {list.map(c => (
                  <div key={c} className="flex items-center justify-between p-1.5 bg-slate-50 rounded text-xs">
                    <span>{c}</span>
                    <button onClick={() => removeCategory(c)} className="text-red-400 hover:text-red-600 text-[10px] cursor-pointer">
                      Delete
                    </button>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex justify-end space-x-2 pt-2 border-t border-gray-100">
              <button onClick={onClose} className="px-3 py-1 border border-gray-200 rounded text-xs cursor-pointer">Cancel</button>
              <button onClick={() => onSave(list)} className="px-4 py-1 bg-brandsky text-white rounded text-xs cursor-pointer">Save</button>
            </div>
          </div>
        </div>
      );
    }

    // --- LOGIN MODAL ---
    function LoginModal({ onClose, onGoogleLogin, onEmailLogin, onOpenConfig }) {
      const [email, setEmail] = useState('');
      const [pass, setPass] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);

      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-5 space-y-4 border border-gray-200 text-xs">
            <div className="flex items-center justify-between border-b border-gray-100 pb-2">
              <span className="font-bold text-sm text-darkslate">{isSignUp ? 'Sign Up' : 'Executive Login'}</span>
              <button onClick={onClose} className="text-slate-400 hover:text-darkslate text-sm cursor-pointer">✕</button>
            </div>

            <button
              onClick={onGoogleLogin}
              className="w-full py-2 bg-slate-800 text-white rounded hover:bg-slate-700 font-medium transition-colors cursor-pointer"
            >
              Sign in with Google
            </button>

            <div className="relative text-center my-2">
              <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-200"></div></div>
              <span className="relative bg-white px-2 text-grayholder text-[10px]">or email</span>
            </div>

            <form onSubmit={(e) => onEmailLogin(e, email, pass, isSignUp)} className="space-y-2.5">
              <div>
                <label className="block font-bold text-gray-800 mb-1">Email</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-3 py-1.5 border border-gray-200 rounded focus:outline-none"
                />
              </div>
              <div>
                <label className="block font-bold text-gray-800 mb-1">Password</label>
                <input
                  type="password"
                  required
                  value={pass}
                  onChange={(e) => setPass(e.target.value)}
                  className="w-full px-3 py-1.5 border border-gray-200 rounded focus:outline-none"
                />
              </div>

              <button type="submit" className="w-full py-1.5 bg-brandsky text-white rounded font-medium cursor-pointer">
                {isSignUp ? 'Create Account' : 'Sign In'}
              </button>
            </form>

            <div className="flex items-center justify-between pt-2 text-[11px]">
              <button onClick={() => setIsSignUp(!isSignUp)} className="text-brandsky hover:underline cursor-pointer">
                {isSignUp ? 'Already have account? Sign in' : 'Need an account? Sign up'}
              </button>
              <button onClick={() => { onClose(); onOpenConfig(); }} className="text-slate-400 hover:underline cursor-pointer">
                Firebase Keys
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- CONFIG MODAL ---
    function ConfigModal({ currentConfig, onClose, onSave }) {
      const [apiKey, setApiKey] = useState(currentConfig?.apiKey || '');
      const [authDomain, setAuthDomain] = useState(currentConfig?.authDomain || '');
      const [projectId, setProjectId] = useState(currentConfig?.projectId || '');

      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-5 space-y-4 border border-gray-200 text-xs">
            <div className="flex items-center justify-between border-b border-gray-100 pb-2">
              <span className="font-bold text-sm text-darkslate">Firebase Configuration</span>
              <button onClick={onClose} className="text-slate-400 hover:text-darkslate text-sm cursor-pointer">✕</button>
            </div>

            <div className="space-y-2.5">
              <div>
                <label className="block font-bold text-gray-800 mb-1">API Key</label>
                <input
                  type="text"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  placeholder="AIzaSy..."
                  className="w-full px-2.5 py-1.5 border border-gray-200 rounded focus:outline-none"
                />
              </div>
              <div>
                <label className="block font-bold text-gray-800 mb-1">Auth Domain</label>
                <input
                  type="text"
                  value={authDomain}
                  onChange={(e) => setAuthDomain(e.target.value)}
                  placeholder="project.firebaseapp.com"
                  className="w-full px-2.5 py-1.5 border border-gray-200 rounded focus:outline-none"
                />
              </div>
              <div>
                <label className="block font-bold text-gray-800 mb-1">Project ID</label>
                <input
                  type="text"
                  value={projectId}
                  onChange={(e) => setProjectId(e.target.value)}
                  placeholder="my-firebase-project"
                  className="w-full px-2.5 py-1.5 border border-gray-200 rounded focus:outline-none"
                />
              </div>
            </div>

            <div className="flex justify-end space-x-2 pt-2 border-t border-gray-100">
              <button onClick={onClose} className="px-3 py-1 border border-gray-200 rounded cursor-pointer">Cancel</button>
              <button
                onClick={() => onSave({ apiKey, authDomain, projectId })}
                className="px-4 py-1 bg-brandsky text-white rounded cursor-pointer"
              >
                Save Firebase Config
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render React App to Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
